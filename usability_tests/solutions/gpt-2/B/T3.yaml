# T3 for GPT-2 (124M): bfloat16 projection matrices, float32 everything else, 64 MiB (67,108,864 bytes) shards.
inputs:
  - model::inputs/base/model.safetensors
transforms:
  - delete: { target: 'h\.(\d+)\.(attn\.bias)' }
  - cast_: { target: '.*', to: float32 }
  - assert: { count: { of: 'h\.(\d+)\.(attn\.c_attn\.weight|attn\.c_proj\.weight|mlp\.c_fc\.weight|mlp\.c_proj\.weight)', is: 48 } }
  - cast_: { target: 'h\.(\d+)\.(attn\.c_attn\.weight|attn\.c_proj\.weight|mlp\.c_fc\.weight|mlp\.c_proj\.weight)', to: bfloat16 }
  # Required checks. "exactly 48 tensors are bfloat16": the 48 matrices
  # are bfloat16 and every other tensor is float32, so no other tensor can be bfloat16.
  - assert: { dtype: { of: 'h\.(\d+)\.(attn\.c_attn\.weight|attn\.c_proj\.weight|mlp\.c_fc\.weight|mlp\.c_proj\.weight)', is: bfloat16 } }
  - assert: { dtype: { of: '(?!h\.\d+\.(?:attn\.c_attn\.weight|attn\.c_proj\.weight|mlp\.c_fc\.weight|mlp\.c_proj\.weight)$).+', is: float32 } }
  - assert: { dtype: { of: h.0.attn.c_attn.weight, is: bfloat16 } }
  - assert: { dtype: { of: wte.weight, is: float32 } }
  - assert: { count: { of: '.*', is: 148 } }
output:
  path: out/T3
  format: safetensors
  # BrainSurgery shard units are binary: 64MB = 64 MiB (67,108,864 bytes) of tensor data per shard.
  shard: 64MB
