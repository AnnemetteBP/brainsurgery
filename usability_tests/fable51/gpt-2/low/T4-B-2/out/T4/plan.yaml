# T4: task-vector merge of two fine-tunes into the base (lambda = 0.4)
inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # ---- Step 1: verify layout and shared (non-MLP) tensors before touching anything ----
  - assert: { count: { of: 'base::.+', is: 160 } }
  - assert: { count: { of: 'ft1::.+', is: 160 } }
  - assert: { count: { of: 'ft2::.+', is: 160 } }
  - assert: { count: { of: 'base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft1::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft2::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  # every non-MLP tensor must be bit-identical in all three (also proves the names match)
  - assert: { equal: { left: 'base::(?!h\.\d+\.mlp\.).+', right: 'ft1::\g<0>' } }
  - assert: { equal: { left: 'base::(?!h\.\d+\.mlp\.).+', right: 'ft2::\g<0>' } }
  # MLP tensors must exist with the same shape/dtype in the fine-tunes (names match there too)
  - assert: { equal: { left: 'ft1::(h\.\d+\.mlp\..+)', right: 'base::\1', eps: 1.0e38 } }
  - assert: { equal: { left: 'ft2::(h\.\d+\.mlp\..+)', right: 'base::\1', eps: 1.0e38 } }

  # ---- Step 2: task vectors, both taken against the unmodified base ----
  - copy: { from: 'ft1::(h\.\d+\.mlp\..+)', to: 'base::tv1.\1' }
  - copy: { from: 'ft2::(h\.\d+\.mlp\..+)', to: 'base::tv2.\1' }
  - subtract_: { from: 'base::(h\.\d+\.mlp\..+)', to: 'base::tv1.\1' }   # tv1 = ft1 - base
  - subtract_: { from: 'base::(h\.\d+\.mlp\..+)', to: 'base::tv2.\1' }   # tv2 = ft2 - base
  - scale_: { target: 'base::tv[12]\.h\.\d+\.mlp\..+', by: 0.4 }
  - assert: { count: { of: 'base::tv1\..+', is: 48 } }
  - assert: { count: { of: 'base::tv2\..+', is: 48 } }

  # ---- merge: base += 0.4*tv1 + 0.4*tv2 (only now is the base modified) ----
  - add_: { from: 'base::tv1\.(h\.\d+\.mlp\..+)', to: 'base::\1' }
  - add_: { from: 'base::tv2\.(h\.\d+\.mlp\..+)', to: 'base::\1' }
  - delete: { target: 'base::tv[12]\..+' }

  # ---- Required checks ----
  - assert: { count: { of: 'base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { writes: { of: 'base::h\.\d+\.mlp\..+', is: 3 } }        # load + 2 add_: all 48 merged
  - assert: { writes: { of: 'base::(?!h\.\d+\.mlp\.).+', is: 1 } }    # load only: nothing else touched
  - assert: { count: { of: 'base::.+', is: 160 } }
  - assert: { dtype: { of: 'base::h\.\d+\.mlp\..+', is: float32 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
