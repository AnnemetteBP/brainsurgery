# T5: merge a PEFT LoRA adapter (r=16, alpha=32, fan_in_fan_out=true) into GPT-2 c_attn.
# For every layer i: h.i.attn.c_attn.weight += 2 * (B @ A).T
inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Preflight: exactly 12 adapter pairs, 160 base tensors, expected shapes.
  - assert: { count: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_A\.weight', is: 12 } }
  - assert: { count: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight', is: 12 } }
  - assert: { count: { of: 'lora::.*', is: 24 } }
  - assert: { count: { of: 'base::.*', is: 160 } }
  - assert: { shape: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_A\.weight', is: [16, 768] } }
  - assert: { shape: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight', is: [2304, 16] } }
  - assert: { shape: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: [768, 2304] } }
  - assert: { dtype: { of: 'lora::.*', is: float32 } }
  - assert: { dtype: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: float32 } }

  # delta_i = B_i @ A_i  -> [2304, 768]  (nn.Linear [out, in] layout), kept as temporaries on base.
  - matmul:
      from_a: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight'
      from_b: 'lora::base_model.model.h.\1.attn.c_attn.lora_A.weight'
      to: 'base::tmp.h.\1.delta'
  - assert: { count: { of: 'base::tmp\.h\.(\d+)\.delta', is: 12 } }
  - assert: { shape: { of: 'base::tmp\.h\.(\d+)\.delta', is: [2304, 768] } }

  # scale = lora_alpha / r = 32 / 16 = 2
  - scale_: { target: 'base::tmp\.h\.(\d+)\.delta', by: 2.0 }

  # fan_in_fan_out = true: base is Conv1D [in, out], so transpose the delta to [768, 2304].
  - permute: { from: 'base::tmp\.h\.(\d+)\.delta', to: 'base::tmp.h.\1.delta_t', order: [1, 0] }
  - assert: { count: { of: 'base::tmp\.h\.(\d+)\.delta_t', is: 12 } }
  - assert: { shape: { of: 'base::tmp\.h\.(\d+)\.delta_t', is: [768, 2304] } }

  # Merge in place: W_i += 2 * (B_i @ A_i).T
  - add_: { from: 'base::tmp\.h\.(\d+)\.delta_t', to: 'base::h.\1.attn.c_attn.weight' }

  # Drop intermediates.
  - delete: { target: 'base::tmp\..*' }

  # Required checks before writing.
  - assert: { count: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_A\.weight', is: 12 } }
  - assert: { count: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: 12 } }
  - assert: { writes: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', ge: 1 } }
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert: { not: { exists: 'base::tmp\..*' } }
  - assert: { shape: { of: 'base::h.0.attn.c_attn.weight', is: [768, 2304] } }
  - assert: { dtype: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: float32 } }
  - assert: { count: { of: 'base::.*', is: 160 } }

output:
  path: out/T5
  format: safetensors
  shard: 100MB
