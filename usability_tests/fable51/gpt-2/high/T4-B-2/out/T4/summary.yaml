transforms:
- assert:
    count:
      of: base::.*
      is: 160
- assert:
    count:
      of: ft1::.*
      is: 160
- assert:
    count:
      of: ft2::.*
      is: 160
- assert:
    dtype:
      of: base::.*
      is: float32
- assert:
    dtype:
      of: ft1::.*
      is: float32
- assert:
    dtype:
      of: ft2::.*
      is: float32
- assert:
    equal:
      left: ft1::(?!h\.\d+\.mlp\.).+
      right: base::\g<0>
- assert:
    equal:
      left: ft2::(?!h\.\d+\.mlp\.).+
      right: base::\g<0>
- assert:
    count:
      of: base::(?!h\.\d+\.mlp\.).+
      is: 112
- assert:
    count:
      of: base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)
      is: 48
- assert:
    count:
      of: ft1::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)
      is: 48
- assert:
    count:
      of: ft2::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)
      is: 48
- copy:
    from: ft1::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))
    to: base::tv1.\1
- copy:
    from: ft2::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))
    to: base::tv2.\1
- assert:
    count:
      of: base::tv1\..+
      is: 48
- assert:
    count:
      of: base::tv2\..+
      is: 48
- subtract_:
    from: base::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))
    to: base::tv1.\1
- subtract_:
    from: base::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))
    to: base::tv2.\1
- scale_:
    target: base::tv[12]\..+
    by: 0.4
- add_:
    from: base::tv1\.(.+)
    to: base::\1
- add_:
    from: base::tv2\.(.+)
    to: base::\1
- delete:
    target: base::tv[12]\..+
- assert:
    count:
      of: base::.*
      is: 160
- assert:
    count:
      of: base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)
      is: 48
- assert:
    not:
      exists: base::tv[12]\..+
- assert:
    equal:
      left: base::(?!h\.\d+\.mlp\.).+
      right: ft1::\g<0>
- assert:
    dtype:
      of: base::.*
      is: float32
