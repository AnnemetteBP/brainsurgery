# T4: task-vector merge of two fine-tunes into the base (lambda = 0.4).
# All edits are made on alias `base`, so `base` is the alias that gets written.
inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # ---- Step 1: shared-tensor verification, before touching anything ----
  # Same number of tensors everywhere.
  - assert: { count: { of: 'base::.*', is: 160 } }
  - assert: { count: { of: 'ft1::.*', is: 160 } }
  - assert: { count: { of: 'ft2::.*', is: 160 } }
  - assert: { dtype: { of: 'base::.*', is: float32 } }
  - assert: { dtype: { of: 'ft1::.*', is: float32 } }
  - assert: { dtype: { of: 'ft2::.*', is: float32 } }
  # Every tensor outside h.<i>.mlp.* in ft1/ft2 must exist in base with the same
  # name, shape, dtype and bit-identical values (no eps).
  - assert: { equal: { left: 'ft1::(?!h\.\d+\.mlp\.).+', right: 'base::\g<0>' } }
  - assert: { equal: { left: 'ft2::(?!h\.\d+\.mlp\.).+', right: 'base::\g<0>' } }
  # 112 non-MLP + 48 MLP = 160 in each checkpoint, so the name sets coincide.
  - assert: { count: { of: 'base::(?!h\.\d+\.mlp\.).+', is: 112 } }
  - assert: { count: { of: 'base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft1::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft2::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }

  # ---- Step 2: task vectors, both taken against the UNMODIFIED base ----
  # tv1.X = ft1[X] ; tv2.X = ft2[X]   (scratch tensors inside alias base)
  - copy: { from: 'ft1::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))', to: 'base::tv1.\1' }
  - copy: { from: 'ft2::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))', to: 'base::tv2.\1' }
  - assert: { count: { of: 'base::tv1\..+', is: 48 } }
  - assert: { count: { of: 'base::tv2\..+', is: 48 } }
  # tvK.X = ftK[X] - base[X]   (base[X] still untouched here; fails if a name is missing)
  - subtract_: { from: 'base::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))', to: 'base::tv1.\1' }
  - subtract_: { from: 'base::(h\.\d+\.mlp\.(?:c_fc|c_proj)\.(?:weight|bias))', to: 'base::tv2.\1' }
  # tvK.X = lambda * (ftK[X] - base[X])
  - scale_: { target: 'base::tv[12]\..+', by: 0.4 }

  # ---- Step 3: out[X] = base[X] + tv1.X + tv2.X, only now modifying base ----
  - add_: { from: 'base::tv1\.(.+)', to: 'base::\1' }
  - add_: { from: 'base::tv2\.(.+)', to: 'base::\1' }
  - delete: { target: 'base::tv[12]\..+' }

  # ---- Required checks on the result ----
  - assert: { count: { of: 'base::.*', is: 160 } }
  - assert: { count: { of: 'base::h\.\d+\.mlp\.(c_fc|c_proj)\.(weight|bias)', is: 48 } }
  - assert: { not: { exists: 'base::tv[12]\..+' } }
  # Everything outside the MLP tensors is still bit-identical to the inputs.
  - assert: { equal: { left: 'base::(?!h\.\d+\.mlp\.).+', right: 'ft1::\g<0>' } }
  - assert: { dtype: { of: 'base::.*', is: float32 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
