# T3: mixed-precision export of GPT-2 (124M) with 64 MiB sharding.
inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity on the input: 160 tensors, 48 projection matrices, 12 causal-mask buffers.
  - assert: { count: { of: '.*', is: 160 } }
  - assert: { count: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'h\.\d+\.attn\.bias', is: 12 } }

  # 1. Cast exactly the 48 projection matrices to bfloat16 (in place, round-to-nearest-even).
  - cast_: { target: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', to: bfloat16 }

  # 3. Drop the 12 non-parameter causal-mask buffers.
  - delete: { target: 'h\.\d+\.attn\.bias' }

  # Required checks (fail loudly before writing).
  # exactly 48 tensors are bfloat16: the 48 projection matrices are bfloat16 and every
  # other tensor is float32.
  - assert:
      all:
        - count: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: 48 }
        - dtype: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: bfloat16 }
        - dtype: { of: '(?!h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight$).*', is: float32 }
  - assert: { dtype: { of: 'h\.0\.attn\.c_attn\.weight', is: bfloat16 } }
  - assert: { dtype: { of: 'wte\.weight', is: float32 } }
  - assert: { not: { exists: 'h\.\d+\.attn\.bias' } }
  - assert: { count: { of: '.*', is: 148 } }

output:
  path: out/T3
  format: safetensors
  shard: 64MB
