inputs:
  - model::inputs/base

transforms:
  # Preflight: 16 blocks, 114 tensors.
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 16 } }
  - assert: { count: { of: '.*', is: 114 } }

  # 1. Remove blocks 2, 6, 10, 14 entirely.
  - delete: { target: 'model\.layers\.(2|6|10|14)\..*' }
  - assert: { count: { of: '.*', is: 86 } }

  # 2. Renumber survivors, ascending old index, so no destination collides.
  - move: { from: ["model", "layers", "3",  "*rest"], to: ["model", "layers", "2",  "*rest"] }
  - move: { from: ["model", "layers", "4",  "*rest"], to: ["model", "layers", "3",  "*rest"] }
  - move: { from: ["model", "layers", "5",  "*rest"], to: ["model", "layers", "4",  "*rest"] }
  - move: { from: ["model", "layers", "7",  "*rest"], to: ["model", "layers", "5",  "*rest"] }
  - move: { from: ["model", "layers", "8",  "*rest"], to: ["model", "layers", "6",  "*rest"] }
  - move: { from: ["model", "layers", "9",  "*rest"], to: ["model", "layers", "7",  "*rest"] }
  - move: { from: ["model", "layers", "11", "*rest"], to: ["model", "layers", "8",  "*rest"] }
  - move: { from: ["model", "layers", "12", "*rest"], to: ["model", "layers", "9",  "*rest"] }
  - move: { from: ["model", "layers", "13", "*rest"], to: ["model", "layers", "10", "*rest"] }
  - move: { from: ["model", "layers", "15", "*rest"], to: ["model", "layers", "11", "*rest"] }

  # Required checks.
  - assert: { not: { exists: 'model\.layers\.(12|13|14|15)\..*' } }
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 12 } }
  - assert: { count: { of: 'model\.layers\.(\d+)\..*', is: 84 } }
  - assert: { count: { of: '.*', is: 86 } }
  - assert: { exists: model.embed_tokens.weight }
  - assert: { exists: lm_head.weight }

output:
  path: out/T1/model.safetensors
  format: safetensors
