inputs:
  - model::inputs/base

transforms:
  # Cast exactly the 112 per-layer projection matrices to bfloat16.
  - cast_:
      target: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
      to: bfloat16

  # Required checks.
  - assert:
      all:
        # the projection pattern matches exactly 112 tensors and all are bfloat16
        - count: { of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight', is: 112 }
        - dtype: { of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight', is: bfloat16 }
        # every other tensor is float32, so exactly 112 tensors are bfloat16
        - dtype: { of: '(?!model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight$).*', is: float32 }
        - dtype: { of: 'model\.layers\.0\.self_attn\.q_proj\.weight', is: bfloat16 }
        - dtype: { of: 'model\.embed_tokens\.weight', is: float32 }
        - count: { of: '.*', is: 114 }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
