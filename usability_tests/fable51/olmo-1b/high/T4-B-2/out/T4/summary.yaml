- subtract_:
    from: base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv2.\g<0>
- scale_:
    target: base::tv2\.model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    by: 0.4
- assert:
    count:
      of: base::tv1\.model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight
