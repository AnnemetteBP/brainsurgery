      exists: base::tv[12]\..+
- assert:
    count:
      of: base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    dtype:
      of: base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight
