# T5: merge a PEFT LoRA adapter into Pythia-1B and write a sharded checkpoint.
# W += (alpha / r) * B @ A  with alpha=32, r=16 -> scale 2, fan_in_fan_out=false (no transpose).
inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # --- preconditions on the inputs -----------------------------------------
  - assert: { count: { of: 'base::.*', is: 244 } }
  - assert: { count: { of: 'lora::.*\.lora_A\.weight', is: 16 } }
  - assert: { count: { of: 'lora::.*\.lora_B\.weight', is: 16 } }
  - assert: { count: { of: 'lora::.*', is: 32 } }
  - assert: { shape: { of: 'lora::base_model.model.gpt_neox.layers.0.attention.query_key_value.lora_A.weight', is: [16, 2048] } }
  - assert: { shape: { of: 'lora::base_model.model.gpt_neox.layers.0.attention.query_key_value.lora_B.weight', is: [6144, 16] } }
  - assert: { dtype: { of: 'lora::.*', is: float32 } }
  - assert: { dtype: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: float16 } }

  # --- delta = B @ A in float32 (adapter factors are float32), one per adapter pair ---
  # The capture in from_a (the module path without the PEFT prefix) selects the matching
  # lora_A and names the intermediate on the base alias, so only 'base' is written to.
  - matmul:
      from_a: 'lora::base_model\.model\.(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.lora_B\.weight'
      from_b: 'lora::base_model.model.\1.lora_A.weight'
      to: 'base::\1.delta'

  # exactly 16 adapter pairs found and paired
  - assert: { count: { of: 'base::.*\.delta', is: 16 } }
  - assert: { shape: { of: 'base::.*\.delta', is: [6144, 2048] } }
  - assert: { dtype: { of: 'base::.*\.delta', is: float32 } }

  # --- scale by alpha / r = 32 / 16 = 2 ------------------------------------
  - scale_: { target: 'base::.*\.delta', by: 2.0 }

  # --- merge in float32, then cast back to the base dtype -------------------
  - cast_: { target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', to: float32 }
  - add_:
      from: 'base::(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.delta'
      to: 'base::\1.weight'
  - cast_: { target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', to: float16 }

  # --- drop the intermediates ------------------------------------------------
  - delete: { target: 'base::.*\.delta' }

  # --- required checks before writing ---------------------------------------
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert: { not: { exists: 'base::.*\.delta' } }
  - assert: { shape: { of: 'base::gpt_neox.layers.0.attention.query_key_value.weight', is: [6144, 2048] } }
  - assert: { dtype: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: float16 } }
  - assert: { count: { of: 'base::.*', is: 244 } }

output:
  path: out/T5
  format: safetensors
  shard: 512MB
