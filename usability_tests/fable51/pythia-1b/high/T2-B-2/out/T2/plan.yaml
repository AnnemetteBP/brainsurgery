      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.13\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.13\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.13.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.14\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.14\.attention\.query_key_value\.weight::[4608:]']
