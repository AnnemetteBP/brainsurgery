      dim: 1

  # Replace the originals with the pruned tensors under their original names.
  - assert: { count: { of: 'pruned\..+', is: 48 } }
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.(weight|bias)' }
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.dense\.weight' }
  - move: { from: 'pruned\.(.+)', to: 'gpt_neox.\1' }

  # Required checks (fail before writing).
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: [5376, 2048] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.bias', is: [5376] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.dense\.weight', is: [2048, 1792] } }
  - assert: { count: { of: '.*', is: 244 } }
  # Extra sanity: no temporaries left, every layer still has its three tensors, dtype kept.
  - assert: { not: { exists: 'pruned\..+' } }
  - assert: { count: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 16 } }
  - assert: { count: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.bias', is: 16 } }
  - assert: { count: { of: 'gpt_neox\.layers\.\d+\.attention\.dense\.weight', is: 16 } }
  - assert: { shape: { of: 'gpt_neox\.layers\.15\.attention\.query_key_value\.weight', is: [5376, 2048] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.15\.attention\.dense\.weight', is: [2048, 1792] } }
  - assert: { dtype: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: float16 } }
