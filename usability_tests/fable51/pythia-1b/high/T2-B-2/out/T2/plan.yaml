      to: pruned.layers.5.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.5\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.5\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.5.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.6\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.6\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.6.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.6\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.6\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.6.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.6\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.6\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.6.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.7\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.7\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.7.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.7\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.7\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.7.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.7\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.7\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.7.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.8\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.8\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.8.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.8\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.8\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.8.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.8\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.8\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.8.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.9\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.9\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.9.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.9\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.9\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.9.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.9\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.9\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.9.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.10\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.10\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.10.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.10\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.10\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.10.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.10\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.10\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.10.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.11\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.11\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.11.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.11\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.11\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.11.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.11\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.11\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.11.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.12\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.12\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.12.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.12\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.12\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.12.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.12\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.12\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.12.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.13\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.13\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.13.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.13\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.13\.attention\.query_key_value\.bias::[4608:]']
