- assert:
    not:
      exists: gpt_neox\.layers\.(2|6|10|14)\..+
- assert:
    count:
      of: .+
      is: 184
- move:
    from: gpt_neox\.layers\.3\.(.+)
    to: gpt_neox.layers.2.\1
- move:
    from: gpt_neox\.layers\.4\.(.+)
    to: gpt_neox.layers.3.\1
- move:
    from: gpt_neox\.layers\.5\.(.+)
    to: gpt_neox.layers.4.\1
- move:
    from: gpt_neox\.layers\.7\.(.+)
    to: gpt_neox.layers.5.\1
- move:
    from: gpt_neox\.layers\.8\.(.+)
    to: gpt_neox.layers.6.\1
- move:
    from: gpt_neox\.layers\.9\.(.+)
    to: gpt_neox.layers.7.\1
- move:
    from: gpt_neox\.layers\.11\.(.+)
    to: gpt_neox.layers.8.\1
- move:
    from: gpt_neox\.layers\.12\.(.+)
    to: gpt_neox.layers.9.\1
- move:
    from: gpt_neox\.layers\.13\.(.+)
    to: gpt_neox.layers.10.\1
