inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity: input layout before pruning.
  - assert: { count: { of: ".*", is: 244 } }
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: [6144, 2048] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.bias', is: [6144] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.dense\.weight', is: [2048, 2048] } }

  # Remove head 5: qkv rows 3840..4607 (768-row interleaved block), dense columns 1280..1535.
  - concat: { from: ['gpt_neox.layers.0.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.0.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.0.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.0.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.0.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.0.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.0.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.0.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.0.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.1.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.1.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.1.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.1.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.1.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.1.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.1.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.1.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.1.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.2.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.2.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.2.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.2.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.2.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.2.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.2.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.2.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.2.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.3.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.3.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.3.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.3.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.3.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.3.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.3.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.3.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.3.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.4.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.4.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.4.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.4.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.4.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.4.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.4.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.4.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.4.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.5.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.5.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.5.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.5.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.5.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.5.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.5.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.5.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.5.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.6.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.6.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.6.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.6.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.6.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.6.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.6.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.6.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.6.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.7.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.7.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.7.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.7.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.7.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.7.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.7.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.7.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.7.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.8.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.8.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.8.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.8.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.8.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.8.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.8.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.8.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.8.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.9.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.9.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.9.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.9.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.9.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.9.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.9.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.9.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.9.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.10.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.10.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.10.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.10.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.10.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.10.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.10.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.10.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.10.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.11.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.11.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.11.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.11.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.11.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.11.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.11.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.11.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.11.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.12.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.12.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.12.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.12.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.12.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.12.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.12.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.12.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.12.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.13.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.13.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.13.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.13.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.13.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.13.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.13.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.13.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.13.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.14.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.14.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.14.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.14.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.14.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.14.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.14.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.14.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.14.attention.dense.weight, dim: 1 }
  - concat: { from: ['gpt_neox.layers.15.attention.query_key_value.weight::[:3840, :]', 'gpt_neox.layers.15.attention.query_key_value.weight::[4608:, :]'], to: pruned.gpt_neox.layers.15.attention.query_key_value.weight, dim: 0 }
  - concat: { from: ['gpt_neox.layers.15.attention.query_key_value.bias::[:3840]', 'gpt_neox.layers.15.attention.query_key_value.bias::[4608:]'], to: pruned.gpt_neox.layers.15.attention.query_key_value.bias, dim: 0 }
  - concat: { from: ['gpt_neox.layers.15.attention.dense.weight::[:, :1280]', 'gpt_neox.layers.15.attention.dense.weight::[:, 1536:]'], to: pruned.gpt_neox.layers.15.attention.dense.weight, dim: 1 }

  # Replace originals with the pruned tensors under the original names.
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.(query_key_value\.(weight|bias)|dense\.weight)' }
  - move: { from: 'pruned\.(gpt_neox\.layers\.\d+\.attention\.(query_key_value\.(weight|bias)|dense\.weight))', to: '\1' }

  # Required checks.
  - assert: { shape: { of: gpt_neox.layers.0.attention.query_key_value.weight, is: [5376, 2048] } }
  - assert: { shape: { of: gpt_neox.layers.0.attention.query_key_value.bias, is: [5376] } }
  - assert: { shape: { of: gpt_neox.layers.0.attention.dense.weight, is: [2048, 1792] } }
  - assert: { count: { of: ".*", is: 244 } }
  # Extra: all layers, and no leftover temporaries.
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: [5376, 2048] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.bias', is: [5376] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.\d+\.attention\.dense\.weight', is: [2048, 1792] } }
  - assert: { not: { exists: 'pruned\..*' } }
  - assert: { dtype: { of: gpt_neox.layers.0.attention.query_key_value.weight, is: float16 } }

output:
  path: out/T2/model.safetensors
  format: safetensors
