inputs:
  - model::inputs/base/model.safetensors

transforms:
  - assert: { count: { of: 'model::.*', is: 244 } }
  # 1. remove blocks 2, 6, 10, 14
  - delete: { target: 'model::gpt_neox\.layers\.(2|6|10|14)\..*' }
  - assert: { count: { of: 'model::.*', is: 184 } }
  # 2. renumber ascending so a destination is always free before it is written
  - move: { from: 'model::gpt_neox\.layers\.3\.(.*)',  to: 'model::gpt_neox.layers.2.\1' }
  - move: { from: 'model::gpt_neox\.layers\.4\.(.*)',  to: 'model::gpt_neox.layers.3.\1' }
  - move: { from: 'model::gpt_neox\.layers\.5\.(.*)',  to: 'model::gpt_neox.layers.4.\1' }
  - move: { from: 'model::gpt_neox\.layers\.7\.(.*)',  to: 'model::gpt_neox.layers.5.\1' }
  - move: { from: 'model::gpt_neox\.layers\.8\.(.*)',  to: 'model::gpt_neox.layers.6.\1' }
  - move: { from: 'model::gpt_neox\.layers\.9\.(.*)',  to: 'model::gpt_neox.layers.7.\1' }
  - move: { from: 'model::gpt_neox\.layers\.11\.(.*)', to: 'model::gpt_neox.layers.8.\1' }
  - move: { from: 'model::gpt_neox\.layers\.12\.(.*)', to: 'model::gpt_neox.layers.9.\1' }
  - move: { from: 'model::gpt_neox\.layers\.13\.(.*)', to: 'model::gpt_neox.layers.10.\1' }
  - move: { from: 'model::gpt_neox\.layers\.15\.(.*)', to: 'model::gpt_neox.layers.11.\1' }
  # required checks
  - assert:
      all:
        - not: { exists: 'model::gpt_neox\.layers\.(12|13|14|15)\..*' }
        - count: { of: 'model::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 12 }
        - count: { of: 'model::gpt_neox\.layers\.(\d|1[01])\..*', is: 180 }
        - count: { of: 'model::.*', is: 184 }

output:
  path: out/T1/model.safetensors
  format: safetensors
