inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Remove only the three documented non-parameter buffers from each layer.
  - assert:
      count:
        of: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.attention\.(?:bias|masked_bias|rotary_emb\.inv_freq)'
        is: 48
  - delete:
      target: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.attention\.(?:bias|masked_bias|rotary_emb\.inv_freq)'

  # Upcast every retained non-projection tensor.
  - cast_:
      target: '(?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight\Z).*'
      to: float32

  # Cast precisely the four projection matrices in every layer.
  - cast_:
      target: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.attention\.(?:query_key_value|dense)\.weight'
      to: bfloat16
  - cast_:
      target: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:dense_h_to_4h|dense_4h_to_h)\.weight'
      to: bfloat16

  # Pre-write checks: the two patterns partition all 196 retained tensors.
  - assert:
      all:
        - count:
            of: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight'
            is: 64
        - dtype:
            of: 'gpt_neox\.layers\.(?:[0-9]|1[0-5])\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight'
            is: bfloat16
        - dtype:
            of: '(?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight\Z).*'
            is: float32
        - dtype:
            of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight'
            is: bfloat16
        - dtype:
            of: 'gpt_neox\.embed_in\.weight'
            is: float32
        - count:
            of: '.*'
            is: 196

output:
  path: out/T3
  format: safetensors
  shard: 256MB
