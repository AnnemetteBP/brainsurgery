  - delete: { target: 'model::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.attention\.(?:query_key_value\.(?:weight|bias)|dense\.weight)' }
  - move: { from: 'model::(.+)\.__pruned', to: 'model::\1' }

  # Required pre-write checks.
  - assert: { shape: { of: model::gpt_neox.layers.0.attention.query_key_value.weight, is: [5376, 2048] } }
  - assert: { shape: { of: model::gpt_neox.layers.0.attention.query_key_value.bias, is: [5376] } }
  - assert: { shape: { of: model::gpt_neox.layers.0.attention.dense.weight, is: [2048, 1792] } }
  - assert: { count: { of: 'model::.*', is: 244 } }

output:
