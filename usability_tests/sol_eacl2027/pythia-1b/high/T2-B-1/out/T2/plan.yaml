  - concat: { from: ['model::gpt_neox.layers.9.attention.query_key_value.weight::[:3840, :]', 'model::gpt_neox.layers.9.attention.query_key_value.weight::[4608:, :]'], to: model::gpt_neox.layers.9.attention.query_key_value.weight.__pruned, dim: 0 }
