inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Validate the complete one-to-one LoRA input set before editing the base.
  - assert:
      all:
        - count:
            of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_A\.weight'
            is: 16
        - count:
            of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_B\.weight'
            is: 16
        - shape:
            of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_A\.weight'
            is: [16, 2048]
        - shape:
            of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_B\.weight'
            is: [6144, 16]
        - count:
            of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
            is: 16

  # Perform both the base accumulation and B @ A in float32.
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float32
  - matmul:
      from_a: 'lora::base_model\.model\.gpt_neox\.layers\.(\d+)\.attention\.query_key_value\.lora_B\.weight'
      from_b: 'lora::base_model.model.gpt_neox.layers.\1.attention.query_key_value.lora_A.weight'
      to: 'base::__merge_delta.\1'
  - assert:
      count:
        of: 'base::__merge_delta\.\d+'
        is: 16
  - scale_:
      target: 'base::__merge_delta\.\d+'
      by: 2.0
  - add_:
      from: 'base::__merge_delta\.(\d+)'
      to: 'base::gpt_neox.layers.\1.attention.query_key_value.weight'
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float16
  - delete:
      target: 'base::__merge_delta\.\d+'

  # Required pre-write checks: clean dense state, expected shape and key count.
  - assert:
      all:
        - not:
            exists: 'base::.*lora_.*'
        - not:
            exists: 'base::__merge_delta\..*'
        - shape:
            of: base::gpt_neox.layers.0.attention.query_key_value.weight
            is: [6144, 2048]
        - dtype:
            of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
            is: float16
        - count:
            of: 'base::.*'
            is: 244

output:
  path: out/T5
  format: safetensors
  shard: 512MB
