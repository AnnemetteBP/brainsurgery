inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Establish the full shared layout and frozen-backbone precondition before
  # any mutating transform. The paired checks establish names/shapes/dtypes
  # for every tensor; exact checks also verify all 180 non-MLP tensor values.
  - assert:
      all:
        - count: {of: 'base::.+', is: 244}
        - count: {of: 'ft1::.+', is: 244}
        - count: {of: 'ft2::.+', is: 244}
        - count: {of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64}
        - count: {of: 'ft1::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64}
        - count: {of: 'ft2::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64}
        - equal:
            left: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
            right: 'ft1::\1'
            eps: .inf
        - equal:
            left: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
            right: 'ft2::\1'
            eps: .inf
        - equal:
            left: 'base::((?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$).+)'
            right: 'ft1::\1'
        - equal:
            left: 'base::((?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$).+)'
            right: 'ft2::\1'

  # Clone both fine-tuned values before changing base, then form both task
  # vectors against the same still-unmodified base in float32.
  - copy:
      from: 'ft1::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::__delta1.\1'
  - copy:
      from: 'ft2::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::__delta2.\1'
  - cast_: {target: 'base::__delta[12]\..+', to: float32}
  - cast_:
      target: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
      to: float32
  - subtract_:
      from: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::__delta1.\1'
  - subtract_:
      from: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::__delta2.\1'
  - scale_: {target: 'base::__delta[12]\..+', by: 0.4}

  # Accumulate the two scaled float32 task vectors, restore the original
  # float16 dtype, and remove all temporary tensors before output.
  - add_:
      from: 'base::__delta1\.(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::\1'
  - add_:
      from: 'base::__delta2\.(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))'
      to: 'base::\1'
  - cast_:
      target: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
      to: float16
  - delete: {target: 'base::__delta[12]\..+'}

  # Final cardinality checks: exactly the 64 intended tensors were selected
  # for merging, and no temporary or extra tensors remain among the 244.
  - assert:
      all:
        - count: {of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64}
        - dtype: {of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: float16}
        - count: {of: 'base::.+', is: 244}

output:
  path: out/T4/model.safetensors
  format: safetensors
