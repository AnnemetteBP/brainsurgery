inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Remove only the three non-parameter attention buffer families.
  - delete:
      target: 'gpt_neox\.layers\.\d+\.attention\.(?:bias|masked_bias|rotary_emb\.inv_freq)'

  # Establish float32 as the dtype for every retained tensor, then narrowly
  # select the four projection-matrix families for bfloat16 storage.
  - cast_: { target: '.*', to: float32 }
  - cast_:
      target: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight'
      to: bfloat16

  # Required pre-write checks. The projection regex has exactly 64 matches;
  # every match must be bfloat16, while all tensors began this phase float32.
  - assert:
      count:
        of: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight'
        is: 64
  - assert:
      dtype:
        of: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.(?:dense_h_to_4h|dense_4h_to_h))\.weight'
        is: bfloat16
  - assert:
      dtype:
        of: gpt_neox.layers.0.attention.query_key_value.weight
        is: bfloat16
  - assert:
      dtype:
        of: gpt_neox.embed_in.weight
        is: float32
  - assert: { count: { of: '.*', is: 196 } }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
