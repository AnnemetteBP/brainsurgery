inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Validate layouts and the frozen-backbone assumption before any mutation.
  - assert: { count: { of: 'base::.*', is: 244 } }
  - assert: { count: { of: 'ft1::.*', is: 244 } }
  - assert: { count: { of: 'ft2::.*', is: 244 } }
  - assert: { count: { of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64 } }
  - assert: { count: { of: 'ft1::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64 } }
  - assert: { count: { of: 'ft2::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64 } }
  - assert: { equal: { left: 'base::((?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$).+)', right: 'ft1::\1' } }
  - assert: { equal: { left: 'base::((?!gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$).+)', right: 'ft2::\1' } }

  # Form both task vectors against the original base, entirely in float32.
  - cast: { from: 'ft1::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::__ft1.\1', dtype: float32 }
  - cast: { from: 'ft2::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::__ft2.\1', dtype: float32 }
  - cast_: { target: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', to: float32 }
  - subtract_: { from: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::__ft1.\1' }
  - subtract_: { from: 'base::(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::__ft2.\1' }
  - scale_: { target: 'base::__ft1\.gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', by: 0.4 }
  - scale_: { target: 'base::__ft2\.gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', by: 0.4 }
  - add_: { from: 'base::__ft1\.(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::\1' }
  - add_: { from: 'base::__ft2\.(gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias))', to: 'base::\1' }
  - cast_: { target: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', to: float16 }
  - delete: { target: 'base::__ft[12]\..+' }

  # Explicit postconditions: 64 merged float16 tensors and 244 output tensors.
  - assert: { count: { of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: 64 } }
  - assert: { dtype: { of: 'base::gpt_neox\.layers\.(?:[0-9]|1[0-5])\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)', is: float16 } }
  - assert: { count: { of: 'base::.*', is: 244 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
  shard: null
