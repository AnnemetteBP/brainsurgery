inputs:
  - base::inputs/base/model.safetensors
  - adapter::inputs/lora/adapter_model.safetensors

transforms:
  # Establish that all 16 expected A/B pairs are present before doing any work.
  - assert:
      all:
        - count:
            of: 'adapter::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_A\.weight'
            is: 16
        - count:
            of: 'adapter::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_B\.weight'
            is: 16

  # Accumulate in float32, matching PEFT's fan_in_fan_out=false rule: B @ A.
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float32
  - matmul:
      from_a: 'adapter::base_model\.model\.gpt_neox\.layers\.(\d+)\.attention\.query_key_value\.lora_B\.weight'
      from_b: 'adapter::base_model.model.gpt_neox.layers.\1.attention.query_key_value.lora_A.weight'
      to: 'base::__lora_merge.\1.delta'
  - assert: { count: { of: 'base::__lora_merge\.\d+\.delta', is: 16 } }
  - scale_: { target: 'base::__lora_merge\.\d+\.delta', by: 2.0 }
  - add_:
      from: 'base::__lora_merge\.(\d+)\.delta'
      to: 'base::gpt_neox.layers.\1.attention.query_key_value.weight'
  - delete: { target: 'base::__lora_merge\.\d+\.delta' }
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float16

  # Required pre-write checks.
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert:
      shape:
        of: base::gpt_neox.layers.0.attention.query_key_value.weight
        is: [6144, 2048]
  - assert: { count: { of: 'base::.*', is: 244 } }

output:
  path: out/T5
  format: safetensors
  shard: 512MB
