inputs:
  - base::inputs/base
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Validate that the adapter contains exactly the expected 32 A/B pairs.
  - assert:
      count:
        of: 'lora::base_model\.model\.(model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj))\.lora_A\.weight'
        is: 32
  - assert:
      count:
        of: 'lora::base_model\.model\.(model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj))\.lora_B\.weight'
        is: 32

  # delta = B @ A; captures map PEFT names to their dense base-weight names.
  - matmul:
      from_a: 'lora::base_model\.model\.(model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj))\.lora_B\.weight'
      from_b: 'lora::base_model.model.\1.lora_A.weight'
      to: 'base::\1.merge_delta'
  - assert: { count: { of: 'base::model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj)\.merge_delta', is: 32 } }
  - scale_: { target: 'base::model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj)\.merge_delta', by: 2.0 }
  - add_:
      from: 'base::(model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj))\.merge_delta'
      to: 'base::\1.weight'
  - delete: { target: 'base::model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj)\.merge_delta' }

  # Required pre-export checks on the output alias.
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert: { shape: { of: base::model.layers.0.self_attn.q_proj.weight, is: [2048, 2048] } }
  - assert: { count: { of: 'base::.*', is: 114 } }

output:
  path: out/T5
  format: safetensors
  shard: 512MB
