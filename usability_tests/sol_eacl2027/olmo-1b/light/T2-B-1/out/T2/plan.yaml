inputs:
  - model::inputs/base

output:
  path: out/T2/model.safetensors
  format: safetensors

transforms:
  - assert: { count: { of: 'model::.*', is: 114 } }
  - assert: { count: { of: 'model::model\.layers\.(\d+)\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.weight', is: 64 } }

  # Remove rows 640:768 from q/k/v and columns 640:768 from o.
  # concat requires each source to identify one tensor, so layers are explicit.
  - concat: { from: ['model::model.layers.0.self_attn.q_proj.weight::[:640, :]', 'model::model.layers.0.self_attn.q_proj.weight::[768:, :]'], to: model::tmp.layers.0.self_attn.q_proj.weight, dim: 0 }
  - concat: { from: ['model::model.layers.0.self_attn.k_proj.weight::[:640, :]', 'model::model.layers.0.self_attn.k_proj.weight::[768:, :]'], to: model::tmp.layers.0.self_attn.k_proj.weight, dim: 0 }
