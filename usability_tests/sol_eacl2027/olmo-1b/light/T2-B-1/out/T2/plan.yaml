  - concat: { from: ['model::model.layers.0.self_attn.o_proj.weight::[:, :640]', 'model::model.layers.0.self_attn.o_proj.weight::[:, 768:]'], to: model::tmp.layers.0.self_attn.o_proj.weight, dim: 1 }
