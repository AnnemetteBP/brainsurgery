  - concat: { from: ['model::model.layers.1.self_attn.o_proj.weight::[:, :640]', 'model::model.layers.1.self_attn.o_proj.weight::[:, 768:]'], to: model::tmp.layers.1.self_attn.o_proj.weight, dim: 1 }
  - concat: { from: ['model::model.layers.2.self_attn.q_proj.weight::[:640, :]', 'model::model.layers.2.self_attn.q_proj.weight::[768:, :]'], to: model::tmp.layers.2.self_attn.q_proj.weight, dim: 0 }
