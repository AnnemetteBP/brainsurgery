inputs:
  - model::inputs/base

transforms:
  - cast_:
      target: 'model\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
      to: bfloat16
  - assert:
      all:
        - count:
            of: 'model\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
            is: 112
        - dtype:
            of: 'model\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
            is: bfloat16
        - dtype:
            of: 'model\.layers\.0\.self_attn\.q_proj\.weight'
            is: bfloat16
        - dtype:
            of: 'model\.embed_tokens\.weight'
            is: float32
        - dtype:
            of: '(?!model\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight$).*'
            is: float32
        - count:
            of: '.*'
            is: 114

output:
  path: out/T3
  format: safetensors
  shard: 256MB
