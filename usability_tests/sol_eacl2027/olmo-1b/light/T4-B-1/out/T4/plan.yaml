inputs:
  - base::inputs/base
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Preflight: establish the complete key-set correspondence before any writes.
  - assert: { count: { of: 'base::.*', is: 114 } }
  - assert: { count: { of: 'ft1::.*', is: 114 } }
  - assert: { count: { of: 'ft2::.*', is: 114 } }
  - assert: { count: { of: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft1::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft2::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert:
      equal:
        left: 'base::((?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft1::\1'
  - assert:
      equal:
        left: 'base::((?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft2::\1'
  - assert:
      dtype:
        of: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32
  - assert:
      dtype:
        of: 'ft1::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32
  - assert:
      dtype:
        of: 'ft2::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32

  # Each delta is formed against the still-unmodified base.
  - copy:
      from: 'ft1::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::model.layers.\1.mlp.\2.weight.ft1_delta'
  - copy:
      from: 'ft2::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::model.layers.\1.mlp.\2.weight.ft2_delta'
  - subtract_:
      from: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::model.layers.\1.mlp.\2.weight.ft1_delta'
  - subtract_:
      from: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::model.layers.\1.mlp.\2.weight.ft2_delta'
  - scale_: { target: 'base::.*\.ft1_delta', by: 0.4 }
  - scale_: { target: 'base::.*\.ft2_delta', by: 0.4 }
  - assert: { count: { of: 'base::.*\.ft1_delta', is: 48 } }
  - assert: { count: { of: 'base::.*\.ft2_delta', is: 48 } }
  - add_:
      from: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight\.ft1_delta'
      to: 'base::model.layers.\1.mlp.\2.weight'
  - add_:
      from: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight\.ft2_delta'
      to: 'base::model.layers.\1.mlp.\2.weight'
  - delete: { target: 'base::.*\.ft1_delta' }
  - delete: { target: 'base::.*\.ft2_delta' }

  # Final output invariants.
  - assert: { count: { of: 'base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'base::.*', is: 114 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
