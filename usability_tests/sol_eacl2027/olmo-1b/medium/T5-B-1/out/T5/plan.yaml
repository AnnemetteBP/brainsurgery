inputs:
  - base::inputs/base
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Establish that all and only the expected 32 A/B pairs are available.
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj)\.lora_A\.weight'
        is: 32
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj)\.lora_B\.weight'
        is: 32

  # Create one float32 B @ A delta per adapted base tensor. The capture is the
  # complete base module name, reused to find A and name the temporary delta.
  - matmul:
      from_a: 'lora::(base_model\.model\.)(model\.layers\.(?:[0-9]|1[0-5])\.self_attn\.(?:q_proj|v_proj))(\.lora_)B(\.weight)'
      from_b: 'lora::\1\2\3A\4'
      to: 'base::__lora_merge.\2'
  - assert:
      count:
        of: 'base::__lora_merge\..+'
        is: 32
  - scale_:
      target: 'base::__lora_merge\..+'
      by: 2.0
  - add_:
      from: 'base::__lora_merge\.(model\..+)'
      to: 'base::\1.weight'
  - delete:
      target: 'base::__lora_merge\..+'

  # Required pre-export checks.
  - assert:
      not:
        exists: 'base::.*lora_.*'
  - assert:
      shape:
        of: 'base::model\.layers\.0\.self_attn\.q_proj\.weight'
        is: [2048, 2048]
  - assert:
      count:
        of: 'base::.*'
        is: 114

output:
  path: out/T5
  format: safetensors
  shard: 512MB
