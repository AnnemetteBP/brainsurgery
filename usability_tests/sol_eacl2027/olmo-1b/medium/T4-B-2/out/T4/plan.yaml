inputs:
  - base::inputs/base
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Preflight: all checkpoints must contain precisely the expected key layout.
  - assert: { count: { of: 'base::.*', is: 114 } }
  - assert: { count: { of: 'ft1::.*', is: 114 } }
  - assert: { count: { of: 'ft2::.*', is: 114 } }
  - assert:
      count:
        of: 'base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: 48
  - assert:
      count:
        of: 'ft1::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: 48
  - assert:
      count:
        of: 'ft2::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: 48
  - assert:
      equal:
        left: 'base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft1::\1'
  - assert:
      equal:
        left: 'base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft2::\1'
  - assert:
      dtype:
        of: 'base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32
  - assert:
      dtype:
        of: 'ft1::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32
  - assert:
      dtype:
        of: 'ft2::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: float32

  # Build both task vectors before changing the base.
  - copy:
      from: 'ft1::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::__task1.\g<0>'
  - subtract_:
      from: 'base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::__task1.\g<0>'
  - scale_: { target: 'base::__task1\..+', by: 0.4 }
  - copy:
      from: 'ft2::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::__task2.\g<0>'
  - subtract_:
      from: 'base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
      to: 'base::__task2.\g<0>'
  - scale_: { target: 'base::__task2\..+', by: 0.4 }
  - assert: { count: { of: 'base::__task1\..+', is: 48 } }
  - assert: { count: { of: 'base::__task2\..+', is: 48 } }

  # Apply the two independently computed task vectors to all 48 MLP tensors.
  - add_:
      from: 'base::__task1\.(model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'
  - add_:
      from: 'base::__task2\.(model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'
  - delete: { target: 'base::__task1\..+' }
  - delete: { target: 'base::__task2\..+' }

  # Final state: exactly the 48 selected tensors were merged, and 114 remain.
  - assert:
      count:
        of: 'base::model\.layers\.([0-9]|1[0-5])\.mlp\.(gate_proj|up_proj|down_proj)\.weight'
        is: 48
  - assert: { count: { of: 'base::.*', is: 114 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
