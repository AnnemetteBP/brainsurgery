inputs:
  - base::inputs/base
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Preflight the complete set of adapter pairs and their expected layouts.
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.lora_A\.weight'
        is: 32
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.lora_B\.weight'
        is: 32
  - assert:
      shape:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.lora_A\.weight'
        is: [16, 2048]
  - assert:
      shape:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.lora_B\.weight'
        is: [2048, 16]
  - assert:
      dtype:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.lora_[AB]\.weight'
        is: float32
  - assert:
      count:
        of: 'base::model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'
        is: 32
  - assert:
      shape:
        of: 'base::model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'
        is: [2048, 2048]
  - assert:
      dtype:
        of: 'base::model\.layers\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'
        is: float32

  # fan_in_fan_out=false: form B @ A directly in [out, in] layout.
  - matmul:
      from_a: 'lora::base_model\.model\.model\.layers\.(\d+)\.(self_attn\.(?:q_proj|v_proj))\.lora_B\.weight'
      from_b: 'lora::base_model.model.model.layers.\1.\2.lora_A.weight'
      to: 'base::__merge_delta.\1.\2.weight'
  - assert:
      count:
        of: 'base::__merge_delta\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'
        is: 32
  - scale_:
      target: 'base::__merge_delta\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'
      by: 2.0
  - add_:
      from: 'base::__merge_delta\.(\d+)\.(self_attn\.(?:q_proj|v_proj))\.weight'
      to: 'base::model.layers.\1.\2.weight'
  - delete:
      target: 'base::__merge_delta\.\d+\.self_attn\.(?:q_proj|v_proj)\.weight'

  # Required checks on the exact state that will be written.
  - assert:
      not:
        exists: 'base::.*lora_.*'
  - assert:
      not:
        exists: 'base::__merge_delta\..*'
  - assert:
      shape:
        of: base::model.layers.0.self_attn.q_proj.weight
        is: [2048, 2048]
  - assert:
      count:
        of: 'base::.*'
        is: 114

output:
  path: out/T5
  format: safetensors
  shard: 512MB
