transforms:
- assert:
    count:
      of: base::.+
      is: 114
- assert:
    count:
      of: ft1::.+
      is: 114
- assert:
    count:
      of: ft2::.+
      is: 114
- assert:
    count:
      of: base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft1::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft2::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    equal:
      left: base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)
      right: ft1::\1
- assert:
    equal:
      left: base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)
      right: ft2::\1
- assert:
    dtype:
      of: base::.+
      is: float32
- assert:
    dtype:
      of: ft1::.+
      is: float32
- assert:
    dtype:
      of: ft2::.+
      is: float32
- scale_:
    target: base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight
    by: 0.2
- scale:
    from: ft1::(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)
    to: base::__t4_ft1.\1
    by: 0.4
- add_:
    from: base::__t4_ft1\.(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)
    to: base::\1
- delete:
    target: base::__t4_ft1\..+
- scale:
    from: ft2::(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)
    to: base::__t4_ft2.\1
    by: 0.4
- add_:
    from: base::__t4_ft2\.(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)
    to: base::\1
- delete:
    target: base::__t4_ft2\..+
- assert:
    count:
      of: base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: base::.+
      is: 114
- assert:
    dtype:
      of: base::.+
      is: float32
