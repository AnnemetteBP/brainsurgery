inputs:
  - base::inputs/base
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Establish the complete key sets before making any changes. There are only
  # 48 names matching mlp_pattern; with 114 total tensors, the remaining 66
  # must be the shared tensors checked pairwise below.
  - assert: { count: { of: 'base::.+', is: 114 } }
  - assert: { count: { of: 'ft1::.+', is: 114 } }
  - assert: { count: { of: 'ft2::.+', is: 114 } }
  - assert: { count: { of: 'base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft1::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft2::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert:
      equal:
        left: 'base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft1::\1'
  - assert:
      equal:
        left: 'base::((?!model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+)'
        right: 'ft2::\1'
  - assert: { dtype: { of: 'base::.+', is: float32 } }
  - assert: { dtype: { of: 'ft1::.+', is: float32 } }
  - assert: { dtype: { of: 'ft2::.+', is: float32 } }

  # base + .4*(ft1-base) + .4*(ft2-base)
  #   = .2*base + .4*ft1 + .4*ft2.
  # The fine-tune terms are formed from the untouched input aliases.
  - scale_:
      target: 'base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight'
      by: 0.2
  - scale:
      from: 'ft1::(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::__t4_ft1.\1'
      by: 0.4
  - add_:
      from: 'base::__t4_ft1\.(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'
  - delete: { target: 'base::__t4_ft1\..+' }
  - scale:
      from: 'ft2::(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::__t4_ft2.\1'
      by: 0.4
  - add_:
      from: 'base::__t4_ft2\.(model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'
  - delete: { target: 'base::__t4_ft2\..+' }

  # Postconditions: exactly the 48 intended tensors were selected for merging,
  # and no temporary or unrelated tensor remains in the 114-tensor output.
  - assert: { count: { of: 'base::model\.layers\.(?:[0-9]|1[0-5])\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'base::.+', is: 114 } }
  - assert: { dtype: { of: 'base::.+', is: float32 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
