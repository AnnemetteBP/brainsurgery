inputs:
  - model::inputs/base

transforms:
  # Match only the seven projection weights in each of layers 0 through 15.
  - assert:
      count:
        of: 'model::model\.layers\.(?:[0-9]|1[0-5])\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
        is: 112
  - cast_:
      target: 'model::model\.layers\.(?:[0-9]|1[0-5])\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
      to: bfloat16

  # Required post-edit checks, all evaluated before the output is written.
  - assert:
      all:
        - count:
            of: 'model::model\.layers\.(?:[0-9]|1[0-5])\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
            is: 112
        - dtype:
            of: 'model::model\.layers\.(?:[0-9]|1[0-5])\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight'
            is: bfloat16
        - dtype:
            of: model::model.layers.0.self_attn.q_proj.weight
            is: bfloat16
        - dtype:
            of: model::model.embed_tokens.weight
            is: float32
        - count:
            of: 'model::.*'
            is: 114

  # Since the input is entirely float32, prove no non-projection tensor was cast.
  - assert:
      dtype:
        of: 'model::(?!model\.layers\.(?:[0-9]|1[0-5])\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))\.weight$).+'
        is: float32

output:
  path: out/T3
  format: safetensors
  shard: 256MB
