inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Validate that the adapter contains exactly twelve complete A/B pairs.
  - assert:
      count:
        of: 'lora::base_model\.model\.h\.\d+\.attn\.c_attn\.lora_A\.weight'
        is: 12
  - assert:
      count:
        of: 'lora::base_model\.model\.h\.\d+\.attn\.c_attn\.lora_B\.weight'
        is: 12

  # Form B @ A for every layer, scale by alpha/r = 2, then transpose from
  # Linear [out, in] layout into GPT-2 Conv1D [in, out] layout.
  - matmul:
      from_a: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight'
      from_b: 'lora::base_model.model.h.\1.attn.c_attn.lora_A.weight'
      to: 'base::__merge.\1.product'
  - assert:
      count:
        of: 'base::__merge\.\d+\.product'
        is: 12
  - scale_:
      target: 'base::__merge\.\d+\.product'
      by: 2.0
  - permute:
      from: 'base::__merge\.(\d+)\.product'
      to: 'base::__merge.\1.delta'
      order: [1, 0]
  - assert:
      count:
        of: 'base::__merge\.\d+\.delta'
        is: 12
  - add_:
      from: 'base::__merge\.(\d+)\.delta'
      to: 'base::h.\1.attn.c_attn.weight'

  # Remove all work tensors, then enforce the required final checkpoint shape.
  - delete:
      target: 'base::__merge\..*'
  - assert:
      not:
        exists: 'base::.*lora_.*'
  - assert:
      shape:
        of: 'base::h\.0\.attn\.c_attn\.weight'
        is: [768, 2304]
  - assert:
      count:
        of: 'base::.*'
        is: 160

output:
  path: out/T5
  format: safetensors
  shard: 100MB
