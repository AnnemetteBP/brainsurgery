inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Rebuild each fused QKV weight, omitting head 5 from each 768-column segment.
  - concat: {from: ['h.0.attn.c_attn.weight::[:, 0:320]', 'h.0.attn.c_attn.weight::[:, 384:768]', 'h.0.attn.c_attn.weight::[:, 768:1088]', 'h.0.attn.c_attn.weight::[:, 1152:1536]', 'h.0.attn.c_attn.weight::[:, 1536:1856]', 'h.0.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.0.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.1.attn.c_attn.weight::[:, 0:320]', 'h.1.attn.c_attn.weight::[:, 384:768]', 'h.1.attn.c_attn.weight::[:, 768:1088]', 'h.1.attn.c_attn.weight::[:, 1152:1536]', 'h.1.attn.c_attn.weight::[:, 1536:1856]', 'h.1.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.1.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.2.attn.c_attn.weight::[:, 0:320]', 'h.2.attn.c_attn.weight::[:, 384:768]', 'h.2.attn.c_attn.weight::[:, 768:1088]', 'h.2.attn.c_attn.weight::[:, 1152:1536]', 'h.2.attn.c_attn.weight::[:, 1536:1856]', 'h.2.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.2.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.3.attn.c_attn.weight::[:, 0:320]', 'h.3.attn.c_attn.weight::[:, 384:768]', 'h.3.attn.c_attn.weight::[:, 768:1088]', 'h.3.attn.c_attn.weight::[:, 1152:1536]', 'h.3.attn.c_attn.weight::[:, 1536:1856]', 'h.3.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.3.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.4.attn.c_attn.weight::[:, 0:320]', 'h.4.attn.c_attn.weight::[:, 384:768]', 'h.4.attn.c_attn.weight::[:, 768:1088]', 'h.4.attn.c_attn.weight::[:, 1152:1536]', 'h.4.attn.c_attn.weight::[:, 1536:1856]', 'h.4.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.4.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.5.attn.c_attn.weight::[:, 0:320]', 'h.5.attn.c_attn.weight::[:, 384:768]', 'h.5.attn.c_attn.weight::[:, 768:1088]', 'h.5.attn.c_attn.weight::[:, 1152:1536]', 'h.5.attn.c_attn.weight::[:, 1536:1856]', 'h.5.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.5.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.6.attn.c_attn.weight::[:, 0:320]', 'h.6.attn.c_attn.weight::[:, 384:768]', 'h.6.attn.c_attn.weight::[:, 768:1088]', 'h.6.attn.c_attn.weight::[:, 1152:1536]', 'h.6.attn.c_attn.weight::[:, 1536:1856]', 'h.6.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.6.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.7.attn.c_attn.weight::[:, 0:320]', 'h.7.attn.c_attn.weight::[:, 384:768]', 'h.7.attn.c_attn.weight::[:, 768:1088]', 'h.7.attn.c_attn.weight::[:, 1152:1536]', 'h.7.attn.c_attn.weight::[:, 1536:1856]', 'h.7.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.7.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.8.attn.c_attn.weight::[:, 0:320]', 'h.8.attn.c_attn.weight::[:, 384:768]', 'h.8.attn.c_attn.weight::[:, 768:1088]', 'h.8.attn.c_attn.weight::[:, 1152:1536]', 'h.8.attn.c_attn.weight::[:, 1536:1856]', 'h.8.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.8.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.9.attn.c_attn.weight::[:, 0:320]', 'h.9.attn.c_attn.weight::[:, 384:768]', 'h.9.attn.c_attn.weight::[:, 768:1088]', 'h.9.attn.c_attn.weight::[:, 1152:1536]', 'h.9.attn.c_attn.weight::[:, 1536:1856]', 'h.9.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.9.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.10.attn.c_attn.weight::[:, 0:320]', 'h.10.attn.c_attn.weight::[:, 384:768]', 'h.10.attn.c_attn.weight::[:, 768:1088]', 'h.10.attn.c_attn.weight::[:, 1152:1536]', 'h.10.attn.c_attn.weight::[:, 1536:1856]', 'h.10.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.10.attn.c_attn.weight, dim: 1}
  - concat: {from: ['h.11.attn.c_attn.weight::[:, 0:320]', 'h.11.attn.c_attn.weight::[:, 384:768]', 'h.11.attn.c_attn.weight::[:, 768:1088]', 'h.11.attn.c_attn.weight::[:, 1152:1536]', 'h.11.attn.c_attn.weight::[:, 1536:1856]', 'h.11.attn.c_attn.weight::[:, 1920:2304]'], to: tmp.h.11.attn.c_attn.weight, dim: 1}

  # Rebuild each fused QKV bias with the identical head-block ordering.
  - concat: {from: ['h.0.attn.c_attn.bias::[0:320]', 'h.0.attn.c_attn.bias::[384:768]', 'h.0.attn.c_attn.bias::[768:1088]', 'h.0.attn.c_attn.bias::[1152:1536]', 'h.0.attn.c_attn.bias::[1536:1856]', 'h.0.attn.c_attn.bias::[1920:2304]'], to: tmp.h.0.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.1.attn.c_attn.bias::[0:320]', 'h.1.attn.c_attn.bias::[384:768]', 'h.1.attn.c_attn.bias::[768:1088]', 'h.1.attn.c_attn.bias::[1152:1536]', 'h.1.attn.c_attn.bias::[1536:1856]', 'h.1.attn.c_attn.bias::[1920:2304]'], to: tmp.h.1.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.2.attn.c_attn.bias::[0:320]', 'h.2.attn.c_attn.bias::[384:768]', 'h.2.attn.c_attn.bias::[768:1088]', 'h.2.attn.c_attn.bias::[1152:1536]', 'h.2.attn.c_attn.bias::[1536:1856]', 'h.2.attn.c_attn.bias::[1920:2304]'], to: tmp.h.2.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.3.attn.c_attn.bias::[0:320]', 'h.3.attn.c_attn.bias::[384:768]', 'h.3.attn.c_attn.bias::[768:1088]', 'h.3.attn.c_attn.bias::[1152:1536]', 'h.3.attn.c_attn.bias::[1536:1856]', 'h.3.attn.c_attn.bias::[1920:2304]'], to: tmp.h.3.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.4.attn.c_attn.bias::[0:320]', 'h.4.attn.c_attn.bias::[384:768]', 'h.4.attn.c_attn.bias::[768:1088]', 'h.4.attn.c_attn.bias::[1152:1536]', 'h.4.attn.c_attn.bias::[1536:1856]', 'h.4.attn.c_attn.bias::[1920:2304]'], to: tmp.h.4.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.5.attn.c_attn.bias::[0:320]', 'h.5.attn.c_attn.bias::[384:768]', 'h.5.attn.c_attn.bias::[768:1088]', 'h.5.attn.c_attn.bias::[1152:1536]', 'h.5.attn.c_attn.bias::[1536:1856]', 'h.5.attn.c_attn.bias::[1920:2304]'], to: tmp.h.5.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.6.attn.c_attn.bias::[0:320]', 'h.6.attn.c_attn.bias::[384:768]', 'h.6.attn.c_attn.bias::[768:1088]', 'h.6.attn.c_attn.bias::[1152:1536]', 'h.6.attn.c_attn.bias::[1536:1856]', 'h.6.attn.c_attn.bias::[1920:2304]'], to: tmp.h.6.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.7.attn.c_attn.bias::[0:320]', 'h.7.attn.c_attn.bias::[384:768]', 'h.7.attn.c_attn.bias::[768:1088]', 'h.7.attn.c_attn.bias::[1152:1536]', 'h.7.attn.c_attn.bias::[1536:1856]', 'h.7.attn.c_attn.bias::[1920:2304]'], to: tmp.h.7.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.8.attn.c_attn.bias::[0:320]', 'h.8.attn.c_attn.bias::[384:768]', 'h.8.attn.c_attn.bias::[768:1088]', 'h.8.attn.c_attn.bias::[1152:1536]', 'h.8.attn.c_attn.bias::[1536:1856]', 'h.8.attn.c_attn.bias::[1920:2304]'], to: tmp.h.8.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.9.attn.c_attn.bias::[0:320]', 'h.9.attn.c_attn.bias::[384:768]', 'h.9.attn.c_attn.bias::[768:1088]', 'h.9.attn.c_attn.bias::[1152:1536]', 'h.9.attn.c_attn.bias::[1536:1856]', 'h.9.attn.c_attn.bias::[1920:2304]'], to: tmp.h.9.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.10.attn.c_attn.bias::[0:320]', 'h.10.attn.c_attn.bias::[384:768]', 'h.10.attn.c_attn.bias::[768:1088]', 'h.10.attn.c_attn.bias::[1152:1536]', 'h.10.attn.c_attn.bias::[1536:1856]', 'h.10.attn.c_attn.bias::[1920:2304]'], to: tmp.h.10.attn.c_attn.bias, dim: 0}
  - concat: {from: ['h.11.attn.c_attn.bias::[0:320]', 'h.11.attn.c_attn.bias::[384:768]', 'h.11.attn.c_attn.bias::[768:1088]', 'h.11.attn.c_attn.bias::[1152:1536]', 'h.11.attn.c_attn.bias::[1536:1856]', 'h.11.attn.c_attn.bias::[1920:2304]'], to: tmp.h.11.attn.c_attn.bias, dim: 0}

  # Rebuild each attention output projection, omitting head 5's input rows.
  - concat: {from: ['h.0.attn.c_proj.weight::[0:320, :]', 'h.0.attn.c_proj.weight::[384:768, :]'], to: tmp.h.0.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.1.attn.c_proj.weight::[0:320, :]', 'h.1.attn.c_proj.weight::[384:768, :]'], to: tmp.h.1.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.2.attn.c_proj.weight::[0:320, :]', 'h.2.attn.c_proj.weight::[384:768, :]'], to: tmp.h.2.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.3.attn.c_proj.weight::[0:320, :]', 'h.3.attn.c_proj.weight::[384:768, :]'], to: tmp.h.3.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.4.attn.c_proj.weight::[0:320, :]', 'h.4.attn.c_proj.weight::[384:768, :]'], to: tmp.h.4.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.5.attn.c_proj.weight::[0:320, :]', 'h.5.attn.c_proj.weight::[384:768, :]'], to: tmp.h.5.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.6.attn.c_proj.weight::[0:320, :]', 'h.6.attn.c_proj.weight::[384:768, :]'], to: tmp.h.6.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.7.attn.c_proj.weight::[0:320, :]', 'h.7.attn.c_proj.weight::[384:768, :]'], to: tmp.h.7.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.8.attn.c_proj.weight::[0:320, :]', 'h.8.attn.c_proj.weight::[384:768, :]'], to: tmp.h.8.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.9.attn.c_proj.weight::[0:320, :]', 'h.9.attn.c_proj.weight::[384:768, :]'], to: tmp.h.9.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.10.attn.c_proj.weight::[0:320, :]', 'h.10.attn.c_proj.weight::[384:768, :]'], to: tmp.h.10.attn.c_proj.weight, dim: 0}
  - concat: {from: ['h.11.attn.c_proj.weight::[0:320, :]', 'h.11.attn.c_proj.weight::[384:768, :]'], to: tmp.h.11.attn.c_proj.weight, dim: 0}

  # Replace only the 36 head-bearing tensors and retain their original names.
  - delete: {target: ['h', '$i', 'attn', 'c_attn', 'weight']}
  - delete: {target: ['h', '$i', 'attn', 'c_attn', 'bias']}
  - delete: {target: ['h', '$i', 'attn', 'c_proj', 'weight']}
  - move: {from: 'tmp\.(h\.\d+\.attn\.c_attn\.weight)', to: '\1'}
  - move: {from: 'tmp\.(h\.\d+\.attn\.c_attn\.bias)', to: '\1'}
  - move: {from: 'tmp\.(h\.\d+\.attn\.c_proj\.weight)', to: '\1'}

  # Required pre-write checks.
  - assert: {shape: {of: h.0.attn.c_attn.weight, is: [768, 2112]}}
  - assert: {shape: {of: h.0.attn.c_attn.bias, is: [2112]}}
  - assert: {shape: {of: h.0.attn.c_proj.weight, is: [704, 768]}}
  - assert: {count: {of: 'model::.*', is: 160}}

output:
  path: out/T2/model.safetensors
  format: safetensors
  shard: null
