inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # Establish exact cardinalities before any mutation.
  - assert: { count: { of: 'base::.+', is: 160 } }
  - assert: { count: { of: 'ft1::.+', is: 160 } }
  - assert: { count: { of: 'ft2::.+', is: 160 } }

  # Empty slices compare shape/dtype and require every base name to exist in
  # each fine-tune, without requiring the changed MLP values to be equal.
  - assert: { equal: { left: 'base::(.+)::[:0]', right: 'ft1::\1::[:0]' } }
  - assert: { equal: { left: 'base::(.+)::[:0]', right: 'ft2::\1::[:0]' } }

  # Verify the intended merge set and floating-point arithmetic dtype.
  - assert: { count: { of: 'base::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft1::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: 48 } }
  - assert: { count: { of: 'ft2::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: 48 } }
  - assert: { dtype: { of: 'base::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: float32 } }
  - assert: { dtype: { of: 'ft1::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: float32 } }
  - assert: { dtype: { of: 'ft2::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: float32 } }

  # Every non-MLP tensor must be bit-exactly shared by all three inputs.
  - assert:
      equal:
        left: 'base::((?!h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)$).+)'
        right: 'ft1::\1'
  - assert:
      equal:
        left: 'base::((?!h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)$).+)'
        right: 'ft2::\1'

  # Materialize both task vectors before modifying the base, so each is
  # computed against the same pristine checkpoint.
  - copy:
      from: 'ft1::(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::__task1.\1'
  - subtract_:
      from: 'base::(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::__task1.\1'
  - copy:
      from: 'ft2::(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::__task2.\1'
  - subtract_:
      from: 'base::(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::__task2.\1'

  - scale_: { target: 'base::__task1\..+', by: 0.4 }
  - scale_: { target: 'base::__task2\..+', by: 0.4 }
  - add_:
      from: 'base::__task1\.(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::\1'
  - add_:
      from: 'base::__task2\.(h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias))'
      to: 'base::\1'

  - delete: { target: 'base::__task1\..+' }
  - delete: { target: 'base::__task2\..+' }

  # The selected merge set remains exactly 48 and the final model exactly 160.
  - assert: { count: { of: 'base::h\.(?:[0-9]|1[01])\.mlp\.c_(?:fc|proj)\.(?:weight|bias)', is: 48 } }
  - assert: { count: { of: 'base::.+', is: 160 } }

output:
  path: out/T4/model.safetensors
  format: safetensors
