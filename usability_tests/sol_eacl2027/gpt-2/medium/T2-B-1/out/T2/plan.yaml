transforms:
  # Rebuild each fused QKV projection without head 5 in each 768-wide segment.
  - concat: { from: ['h.0.attn.c_attn.weight::[:, 0:320]', 'h.0.attn.c_attn.weight::[:, 384:768]', 'h.0.attn.c_attn.weight::[:, 768:1088]', 'h.0.attn.c_attn.weight::[:, 1152:1536]', 'h.0.attn.c_attn.weight::[:, 1536:1856]', 'h.0.attn.c_attn.weight::[:, 1920:2304]'], to: h.0.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.1.attn.c_attn.weight::[:, 0:320]', 'h.1.attn.c_attn.weight::[:, 384:768]', 'h.1.attn.c_attn.weight::[:, 768:1088]', 'h.1.attn.c_attn.weight::[:, 1152:1536]', 'h.1.attn.c_attn.weight::[:, 1536:1856]', 'h.1.attn.c_attn.weight::[:, 1920:2304]'], to: h.1.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.2.attn.c_attn.weight::[:, 0:320]', 'h.2.attn.c_attn.weight::[:, 384:768]', 'h.2.attn.c_attn.weight::[:, 768:1088]', 'h.2.attn.c_attn.weight::[:, 1152:1536]', 'h.2.attn.c_attn.weight::[:, 1536:1856]', 'h.2.attn.c_attn.weight::[:, 1920:2304]'], to: h.2.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.3.attn.c_attn.weight::[:, 0:320]', 'h.3.attn.c_attn.weight::[:, 384:768]', 'h.3.attn.c_attn.weight::[:, 768:1088]', 'h.3.attn.c_attn.weight::[:, 1152:1536]', 'h.3.attn.c_attn.weight::[:, 1536:1856]', 'h.3.attn.c_attn.weight::[:, 1920:2304]'], to: h.3.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.4.attn.c_attn.weight::[:, 0:320]', 'h.4.attn.c_attn.weight::[:, 384:768]', 'h.4.attn.c_attn.weight::[:, 768:1088]', 'h.4.attn.c_attn.weight::[:, 1152:1536]', 'h.4.attn.c_attn.weight::[:, 1536:1856]', 'h.4.attn.c_attn.weight::[:, 1920:2304]'], to: h.4.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.5.attn.c_attn.weight::[:, 0:320]', 'h.5.attn.c_attn.weight::[:, 384:768]', 'h.5.attn.c_attn.weight::[:, 768:1088]', 'h.5.attn.c_attn.weight::[:, 1152:1536]', 'h.5.attn.c_attn.weight::[:, 1536:1856]', 'h.5.attn.c_attn.weight::[:, 1920:2304]'], to: h.5.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.6.attn.c_attn.weight::[:, 0:320]', 'h.6.attn.c_attn.weight::[:, 384:768]', 'h.6.attn.c_attn.weight::[:, 768:1088]', 'h.6.attn.c_attn.weight::[:, 1152:1536]', 'h.6.attn.c_attn.weight::[:, 1536:1856]', 'h.6.attn.c_attn.weight::[:, 1920:2304]'], to: h.6.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.7.attn.c_attn.weight::[:, 0:320]', 'h.7.attn.c_attn.weight::[:, 384:768]', 'h.7.attn.c_attn.weight::[:, 768:1088]', 'h.7.attn.c_attn.weight::[:, 1152:1536]', 'h.7.attn.c_attn.weight::[:, 1536:1856]', 'h.7.attn.c_attn.weight::[:, 1920:2304]'], to: h.7.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.8.attn.c_attn.weight::[:, 0:320]', 'h.8.attn.c_attn.weight::[:, 384:768]', 'h.8.attn.c_attn.weight::[:, 768:1088]', 'h.8.attn.c_attn.weight::[:, 1152:1536]', 'h.8.attn.c_attn.weight::[:, 1536:1856]', 'h.8.attn.c_attn.weight::[:, 1920:2304]'], to: h.8.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.9.attn.c_attn.weight::[:, 0:320]', 'h.9.attn.c_attn.weight::[:, 384:768]', 'h.9.attn.c_attn.weight::[:, 768:1088]', 'h.9.attn.c_attn.weight::[:, 1152:1536]', 'h.9.attn.c_attn.weight::[:, 1536:1856]', 'h.9.attn.c_attn.weight::[:, 1920:2304]'], to: h.9.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.10.attn.c_attn.weight::[:, 0:320]', 'h.10.attn.c_attn.weight::[:, 384:768]', 'h.10.attn.c_attn.weight::[:, 768:1088]', 'h.10.attn.c_attn.weight::[:, 1152:1536]', 'h.10.attn.c_attn.weight::[:, 1536:1856]', 'h.10.attn.c_attn.weight::[:, 1920:2304]'], to: h.10.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.11.attn.c_attn.weight::[:, 0:320]', 'h.11.attn.c_attn.weight::[:, 384:768]', 'h.11.attn.c_attn.weight::[:, 768:1088]', 'h.11.attn.c_attn.weight::[:, 1152:1536]', 'h.11.attn.c_attn.weight::[:, 1536:1856]', 'h.11.attn.c_attn.weight::[:, 1920:2304]'], to: h.11.attn.c_attn.weight.pruned, dim: 1 }

  # Bias follows the fused projection's column layout.
  - concat: { from: ['h.0.attn.c_attn.bias::[0:320]', 'h.0.attn.c_attn.bias::[384:768]', 'h.0.attn.c_attn.bias::[768:1088]', 'h.0.attn.c_attn.bias::[1152:1536]', 'h.0.attn.c_attn.bias::[1536:1856]', 'h.0.attn.c_attn.bias::[1920:2304]'], to: h.0.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.1.attn.c_attn.bias::[0:320]', 'h.1.attn.c_attn.bias::[384:768]', 'h.1.attn.c_attn.bias::[768:1088]', 'h.1.attn.c_attn.bias::[1152:1536]', 'h.1.attn.c_attn.bias::[1536:1856]', 'h.1.attn.c_attn.bias::[1920:2304]'], to: h.1.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.2.attn.c_attn.bias::[0:320]', 'h.2.attn.c_attn.bias::[384:768]', 'h.2.attn.c_attn.bias::[768:1088]', 'h.2.attn.c_attn.bias::[1152:1536]', 'h.2.attn.c_attn.bias::[1536:1856]', 'h.2.attn.c_attn.bias::[1920:2304]'], to: h.2.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.3.attn.c_attn.bias::[0:320]', 'h.3.attn.c_attn.bias::[384:768]', 'h.3.attn.c_attn.bias::[768:1088]', 'h.3.attn.c_attn.bias::[1152:1536]', 'h.3.attn.c_attn.bias::[1536:1856]', 'h.3.attn.c_attn.bias::[1920:2304]'], to: h.3.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.4.attn.c_attn.bias::[0:320]', 'h.4.attn.c_attn.bias::[384:768]', 'h.4.attn.c_attn.bias::[768:1088]', 'h.4.attn.c_attn.bias::[1152:1536]', 'h.4.attn.c_attn.bias::[1536:1856]', 'h.4.attn.c_attn.bias::[1920:2304]'], to: h.4.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.5.attn.c_attn.bias::[0:320]', 'h.5.attn.c_attn.bias::[384:768]', 'h.5.attn.c_attn.bias::[768:1088]', 'h.5.attn.c_attn.bias::[1152:1536]', 'h.5.attn.c_attn.bias::[1536:1856]', 'h.5.attn.c_attn.bias::[1920:2304]'], to: h.5.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.6.attn.c_attn.bias::[0:320]', 'h.6.attn.c_attn.bias::[384:768]', 'h.6.attn.c_attn.bias::[768:1088]', 'h.6.attn.c_attn.bias::[1152:1536]', 'h.6.attn.c_attn.bias::[1536:1856]', 'h.6.attn.c_attn.bias::[1920:2304]'], to: h.6.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.7.attn.c_attn.bias::[0:320]', 'h.7.attn.c_attn.bias::[384:768]', 'h.7.attn.c_attn.bias::[768:1088]', 'h.7.attn.c_attn.bias::[1152:1536]', 'h.7.attn.c_attn.bias::[1536:1856]', 'h.7.attn.c_attn.bias::[1920:2304]'], to: h.7.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.8.attn.c_attn.bias::[0:320]', 'h.8.attn.c_attn.bias::[384:768]', 'h.8.attn.c_attn.bias::[768:1088]', 'h.8.attn.c_attn.bias::[1152:1536]', 'h.8.attn.c_attn.bias::[1536:1856]', 'h.8.attn.c_attn.bias::[1920:2304]'], to: h.8.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.9.attn.c_attn.bias::[0:320]', 'h.9.attn.c_attn.bias::[384:768]', 'h.9.attn.c_attn.bias::[768:1088]', 'h.9.attn.c_attn.bias::[1152:1536]', 'h.9.attn.c_attn.bias::[1536:1856]', 'h.9.attn.c_attn.bias::[1920:2304]'], to: h.9.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.10.attn.c_attn.bias::[0:320]', 'h.10.attn.c_attn.bias::[384:768]', 'h.10.attn.c_attn.bias::[768:1088]', 'h.10.attn.c_attn.bias::[1152:1536]', 'h.10.attn.c_attn.bias::[1536:1856]', 'h.10.attn.c_attn.bias::[1920:2304]'], to: h.10.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.11.attn.c_attn.bias::[0:320]', 'h.11.attn.c_attn.bias::[384:768]', 'h.11.attn.c_attn.bias::[768:1088]', 'h.11.attn.c_attn.bias::[1152:1536]', 'h.11.attn.c_attn.bias::[1536:1856]', 'h.11.attn.c_attn.bias::[1920:2304]'], to: h.11.attn.c_attn.bias.pruned, dim: 0 }

  # Rebuild each attention output projection without head 5's input rows.
  - concat: { from: ['h.0.attn.c_proj.weight::[0:320, :]', 'h.0.attn.c_proj.weight::[384:768, :]'], to: h.0.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.1.attn.c_proj.weight::[0:320, :]', 'h.1.attn.c_proj.weight::[384:768, :]'], to: h.1.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.2.attn.c_proj.weight::[0:320, :]', 'h.2.attn.c_proj.weight::[384:768, :]'], to: h.2.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.3.attn.c_proj.weight::[0:320, :]', 'h.3.attn.c_proj.weight::[384:768, :]'], to: h.3.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.4.attn.c_proj.weight::[0:320, :]', 'h.4.attn.c_proj.weight::[384:768, :]'], to: h.4.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.5.attn.c_proj.weight::[0:320, :]', 'h.5.attn.c_proj.weight::[384:768, :]'], to: h.5.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.6.attn.c_proj.weight::[0:320, :]', 'h.6.attn.c_proj.weight::[384:768, :]'], to: h.6.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.7.attn.c_proj.weight::[0:320, :]', 'h.7.attn.c_proj.weight::[384:768, :]'], to: h.7.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.8.attn.c_proj.weight::[0:320, :]', 'h.8.attn.c_proj.weight::[384:768, :]'], to: h.8.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.9.attn.c_proj.weight::[0:320, :]', 'h.9.attn.c_proj.weight::[384:768, :]'], to: h.9.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.10.attn.c_proj.weight::[0:320, :]', 'h.10.attn.c_proj.weight::[384:768, :]'], to: h.10.attn.c_proj.weight.pruned, dim: 0 }
  - concat: { from: ['h.11.attn.c_proj.weight::[0:320, :]', 'h.11.attn.c_proj.weight::[384:768, :]'], to: h.11.attn.c_proj.weight.pruned, dim: 0 }

  # Replace the originals while retaining their exact checkpoint names.
  - delete: { target: 'h\.\d+\.attn\.(?:c_attn\.(?:weight|bias)|c_proj\.weight)' }
  - move: { from: 'h\.(\d+)\.attn\.c_attn\.weight\.pruned', to: 'h.\1.attn.c_attn.weight' }
  - move: { from: 'h\.(\d+)\.attn\.c_attn\.bias\.pruned', to: 'h.\1.attn.c_attn.bias' }
  - move: { from: 'h\.(\d+)\.attn\.c_proj\.weight\.pruned', to: 'h.\1.attn.c_proj.weight' }

  # Required pre-write checks.
  - assert: { shape: { of: h.0.attn.c_attn.weight, is: [768, 2112] } }
  - assert: { shape: { of: h.0.attn.c_attn.bias, is: [2112] } }
  - assert: { shape: { of: h.0.attn.c_proj.weight, is: [704, 768] } }
  - assert: { count: { of: '.*', is: 160 } }

output:
  path: out/T2/model.safetensors
  format: safetensors
