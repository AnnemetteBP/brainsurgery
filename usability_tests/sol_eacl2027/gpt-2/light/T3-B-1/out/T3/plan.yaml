inputs:
  - model::inputs/base/model.safetensors

transforms:
  - cast_:
      target: 'h\.(?:[0-9]|1[01])\.(?:attn\.c_(?:attn|proj)|mlp\.c_(?:fc|proj))\.weight'
      to: bfloat16
  - assert:
      all:
        - count:
            of: 'h\.(?:[0-9]|1[01])\.(?:attn\.c_(?:attn|proj)|mlp\.c_(?:fc|proj))\.weight'
            is: 48
        - dtype:
            of: 'h\.(?:[0-9]|1[01])\.(?:attn\.c_(?:attn|proj)|mlp\.c_(?:fc|proj))\.weight'
            is: bfloat16
        - dtype:
            of: '(?!h\.(?:[0-9]|1[01])\.(?:attn\.c_(?:attn|proj)|mlp\.c_(?:fc|proj))\.weight$).+'
            is: float32
  - assert:
      dtype:
        of: h.0.attn.c_attn.weight
        is: bfloat16
  - assert:
      dtype:
        of: wte.weight
        is: float32
  - delete:
      target: 'h\.(?:[0-9]|1[01])\.attn\.bias'
  - assert:
      count:
        of: '.+'
        is: 148

output:
  path: out/T3
  format: safetensors
  shard: 64MB
