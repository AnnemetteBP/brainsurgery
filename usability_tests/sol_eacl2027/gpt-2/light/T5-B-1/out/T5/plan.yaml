inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # Validate that all and only the expected adapter pairs and destinations exist.
  - assert: { count: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_A\.weight', is: 12 } }
  - assert: { count: { of: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight', is: 12 } }
  - assert: { count: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: 12 } }
  - assert: { count: { of: 'base::.*', is: 160 } }

  # Compute B @ A in float32 for all layers, transpose Conv1D-style, and scale by alpha/r.
  - matmul:
      from_a: 'lora::base_model\.model\.h\.(\d+)\.attn\.c_attn\.lora_B\.weight'
      from_b: 'lora::base_model.model.h.\1.attn.c_attn.lora_A.weight'
      to: 'base::__merge_product.\1'
  - assert: { count: { of: 'base::__merge_product\.(\d+)', is: 12 } }
  - permute:
      from: 'base::__merge_product\.(\d+)'
      to: 'base::__merge_transposed.\1'
      order: [1, 0]
  - scale:
      from: 'base::__merge_transposed\.(\d+)'
      to: 'base::__merge_scaled.\1'
      by: 2.0
  - add_:
      from: 'base::__merge_scaled\.(\d+)'
      to: 'base::h.\1.attn.c_attn.weight'

  # Remove all intermediate tensors, leaving the original dense key set only.
  - delete: { target: 'base::__merge_.*' }

  # Required final-state checks, evaluated before output writing.
  - assert: { count: { of: 'base::.*', is: 160 } }
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert: { shape: { of: 'base::h.0.attn.c_attn.weight', is: [768, 2304] } }
  - assert: { dtype: { of: 'base::h\.(\d+)\.attn\.c_attn\.weight', is: float32 } }

output:
  path: out/T5
  format: safetensors
  shard: 100MB
