inputs:
  - model::inputs/base

transforms:
  # sanity: the input really is the 16-layer model (114 tensors)
  - assert:
      all:
        - count: { of: '.*', is: 114 }
        - count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 16 }

  # 1) drop blocks 2, 6, 10, 14 (whole blocks, all 7 tensors each)
  - delete: { target: 'model\.layers\.(2|6|10|14)\..*' }
  - assert:
      all:
        - count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 12 }
        - not: { exists: 'model\.layers\.(2|6|10|14)\..*' }

  # 2) renumber survivors in ascending order of the target index, so every
  #    destination slot is already free when it is written (no collisions).
  - move: { from: 'model\.layers\.3\.(.*)',  to: 'model.layers.2.\1' }
  - move: { from: 'model\.layers\.4\.(.*)',  to: 'model.layers.3.\1' }
  - move: { from: 'model\.layers\.5\.(.*)',  to: 'model.layers.4.\1' }
  - move: { from: 'model\.layers\.7\.(.*)',  to: 'model.layers.5.\1' }
  - move: { from: 'model\.layers\.8\.(.*)',  to: 'model.layers.6.\1' }
  - move: { from: 'model\.layers\.9\.(.*)',  to: 'model.layers.7.\1' }
  - move: { from: 'model\.layers\.11\.(.*)', to: 'model.layers.8.\1' }
  - move: { from: 'model\.layers\.12\.(.*)', to: 'model.layers.9.\1' }
  - move: { from: 'model\.layers\.13\.(.*)', to: 'model.layers.10.\1' }
  - move: { from: 'model\.layers\.15\.(.*)', to: 'model.layers.11.\1' }

  # 3) required checks
  - assert:
      all:
        # no tensor of blocks 12, 13, 14, 15 remains
        - not: { exists: 'model\.layers\.1[2-5]\..*' }
        # exactly 12 blocks remain, contiguous 0..11, each complete (7 tensors)
        - count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 12 }
        - count: { of: 'model\.layers\.([0-9]|1[01])\..*', is: 84 }
        - count: { of: 'model\.layers\.\d+\..*', is: 84 }
        # the 2 non-block tensors are still there
        - exists: 'model\.embed_tokens\.weight'
        - exists: 'lm_head\.weight'
        # total tensor count
        - count: { of: '.*', is: 86 }

output:
  path: out/T1/model.safetensors
  format: safetensors
