# T3: mixed-precision export with sharding (OLMo-1B-0724-hf)
#
# Cast only the 112 per-layer projection matrices to bfloat16; leave
# model.embed_tokens.weight and lm_head.weight in float32. Nothing is
# deleted or renamed. Output is a sharded safetensors directory with a
# 256MiB per-shard tensor-data budget plus model.safetensors.index.json.

inputs:
  - model::inputs/base

transforms:
  # Preflight: the input is what we expect.
  - assert:
      all:
        - count: { of: '.*', is: 114 }
        - count:
            of: 'model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)\.weight'
            is: 112
        - dtype: { of: '.*', is: float32 }

  # Cast exactly the projection matrices, in place, names unchanged.
  - cast_:
      target: 'model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)\.weight'
      to: bfloat16

  # Required checks.
  - assert:
      all:
        # exactly 112 tensors are bfloat16: the 112 projections are bf16 ...
        - count:
            of: 'model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)\.weight'
            is: 112
        - dtype:
            of: 'model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)\.weight'
            is: bfloat16
        # ... and every other tensor is still float32.
        - dtype:
            of: '(?!model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)\.weight$).*'
            is: float32
        - dtype: { of: 'model\.layers\.0\.self_attn\.q_proj\.weight', is: bfloat16 }
        - dtype: { of: 'model\.embed_tokens\.weight', is: float32 }
        - count: { of: '.*', is: 114 }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
