# T4: task-vector merge of two GPT-2 fine-tunes, lambda = 0.4
#   out[X] = base[X] + 0.4*(ft1[X]-base[X]) + 0.4*(ft2[X]-base[X])  for the 48 MLP tensors
# All edits happen on the `base` alias so the output model is unambiguous.
inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # ---- step 1: verification, before anything is touched -------------------
  - assert:
      all:
        - count: { of: 'base::.*', is: 160 }
        - count: { of: 'ft1::.*', is: 160 }
        - count: { of: 'ft2::.*', is: 160 }
        - count: { of: 'base::h\.\d+\.mlp\..+', is: 48 }
        - count: { of: 'ft1::h\.\d+\.mlp\..+', is: 48 }
        - count: { of: 'ft2::h\.\d+\.mlp\..+', is: 48 }
        # every non-MLP tensor of the base exists under the same name in both
        # fine-tunes and is bit-identical there
        - equal: { left: 'base::(?!h\.\d+\.mlp\.).+', right: 'ft1::\g<0>', eps: 0.0 }
        - equal: { left: 'base::(?!h\.\d+\.mlp\.).+', right: 'ft2::\g<0>', eps: 0.0 }
        # and the reverse direction, so neither fine-tune has extra/renamed names
        - equal: { left: 'ft1::(?!h\.\d+\.mlp\.).+', right: 'base::\g<0>', eps: 0.0 }
        - equal: { left: 'ft2::(?!h\.\d+\.mlp\.).+', right: 'base::\g<0>', eps: 0.0 }

  # ---- step 2: task vectors, both taken against the *unmodified* base ------
  - copy: { from: 'ft1::(h\.\d+\.mlp\..+)', to: 'base::tv1.\1' }
  - copy: { from: 'ft2::(h\.\d+\.mlp\..+)', to: 'base::tv2.\1' }
  - assert:
      all:
        - count: { of: 'base::tv1\..+', is: 48 }
        - count: { of: 'base::tv2\..+', is: 48 }

  # tv = ft - base   (fails loudly if an MLP name is missing on either side)
  - subtract_: { from: 'base::(h\.\d+\.mlp\..+)', to: 'base::tv1.\1' }
  - subtract_: { from: 'base::(h\.\d+\.mlp\..+)', to: 'base::tv2.\1' }
  # tv *= lambda
  - scale_: { target: 'base::tv1\..+', by: 0.4 }
  - scale_: { target: 'base::tv2\..+', by: 0.4 }
  # base += tv1; base += tv2
  - add_: { from: 'base::tv1\.(h\.\d+\.mlp\..+)', to: 'base::\1' }
  - add_: { from: 'base::tv2\.(h\.\d+\.mlp\..+)', to: 'base::\1' }

  # ---- step 3: drop scratch tensors and check the result ------------------
  - delete: { target: 'base::tv1\..+' }
  - delete: { target: 'base::tv2\..+' }
  - assert:
      all:
        - count: { of: 'base::.*', is: 160 }
        - dtype: { of: 'base::h\.\d+\.mlp\..+', is: float32 }

output:
  path: out/T4/model.safetensors
  format: safetensors
