inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity: the input really is a 12-block, 160-tensor GPT-2.
  - assert:
      all:
        - count: { of: '.*', is: 160 }
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 }

  # 1. Drop blocks 2, 5, 8 entirely.
  - delete: { target: 'h\.2\..*' }
  - delete: { target: 'h\.5\..*' }
  - delete: { target: 'h\.8\..*' }

  - assert:
      all:
        - count: { of: '.*', is: 121 }
        - not: { exists: 'h\.(2|5|8)\..*' }

  # 2. Renumber survivors in ascending order; each destination slot is free
  #    at the time it is written, so no block can overwrite another.
  - move: { from: 'h\.3\.(.+)', to: 'h.2.\1' }
  - move: { from: 'h\.4\.(.+)', to: 'h.3.\1' }
  - move: { from: 'h\.6\.(.+)', to: 'h.4.\1' }
  - move: { from: 'h\.7\.(.+)', to: 'h.5.\1' }
  - move: { from: 'h\.9\.(.+)', to: 'h.6.\1' }
  - move: { from: 'h\.10\.(.+)', to: 'h.7.\1' }
  - move: { from: 'h\.11\.(.+)', to: 'h.8.\1' }

  # 3. Required checks.
  - assert:
      all:
        # no tensor of blocks 9, 10, 11 remains
        - not: { exists: 'h\.(9|10|11)\..*' }
        # exactly 9 blocks remain, indices 0..8 contiguous
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 }
        - count: { of: 'h\.[0-8]\..*', is: 117 }
        # the output has exactly 121 tensors
        - count: { of: '.*', is: 121 }
        # the 4 non-block tensors are still present
        - exists: 'wte\.weight'
        - exists: 'wpe\.weight'
        - exists: 'ln_f\.weight'
        - exists: 'ln_f\.bias'

output:
  path: out/T1/model.safetensors
  format: safetensors
