  - delete: { target: 'h\.11\.attn\.c_attn\.weight' }
  - delete: { target: 'h\.11\.attn\.c_attn\.bias' }
  - delete: { target: 'h\.11\.attn\.c_proj\.weight' }
  - move: { from: 'pruned.11.c_attn.weight', to: 'h.11.attn.c_attn.weight' }
  - move: { from: 'pruned.11.c_attn.bias', to: 'h.11.attn.c_attn.bias' }
  - move: { from: 'pruned.11.c_proj.weight', to: 'h.11.attn.c_proj.weight' }

  # Required checks: shapes of the pruned projections and the total tensor count.
  - assert:
      all:
        - shape: { of: 'h.0.attn.c_attn.weight', is: [768, 2112] }
        - shape: { of: 'h.0.attn.c_attn.bias', is: [2112] }
        - shape: { of: 'h.0.attn.c_proj.weight', is: [704, 768] }
        - count: { of: '.*', is: 160 }
  # No leftover scratch tensors, and every layer got the same treatment.
  - assert:
      not: { exists: 'pruned\..*' }
  - assert:
      all:
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 }
        - count: { of: 'h\.\d+\.attn\.c_proj\.bias', is: 12 }
        - shape: { of: 'h.11.attn.c_attn.weight', is: [768, 2112] }
        - shape: { of: 'h.11.attn.c_attn.bias', is: [2112] }
        - shape: { of: 'h.11.attn.c_proj.weight', is: [704, 768] }
        - shape: { of: 'h.11.attn.c_proj.bias', is: [768] }
        - dtype: { of: 'h.0.attn.c_attn.weight', is: float32 }

output:
  path: out/T2/model.safetensors
  format: safetensors
