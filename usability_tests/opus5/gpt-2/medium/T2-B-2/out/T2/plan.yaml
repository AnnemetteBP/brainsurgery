# T2: structured attention-head pruning of GPT-2 (124M): drop head 5 in every layer.
#
# GPT-2 uses Conv1D layout ([in, out]), so:
#   attn.c_attn.weight [768, 2304] = fused [q|k|v]; heads are column blocks of 64
#     inside each 768-wide segment -> head 5 occupies columns 320:384 (q),
#     1088:1152 (k), 1856:1920 (v).
#   attn.c_attn.bias [2304] = same layout along its single axis.
#   attn.c_proj.weight [768, 768] = output projection; heads are row blocks of 64
#     -> head 5 occupies rows 320:384.
#
# Each pruned tensor is rebuilt with concat over the kept slices (piece order
# preserved), written to a temporary name, then the original is deleted and the
# rebuilt tensor is moved back onto the original name.

inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity check on the inputs before any edit.
  - assert:
      all:
        - count: { of: '.*', is: 160 }
        - shape: { of: 'h.0.attn.c_attn.weight', is: [768, 2304] }
        - shape: { of: 'h.0.attn.c_attn.bias', is: [2304] }
        - shape: { of: 'h.0.attn.c_proj.weight', is: [768, 768] }

  # ---- layer 0 ----
  - concat:
      from:
        - 'h.0.attn.c_attn.weight::[:, 0:320]'
        - 'h.0.attn.c_attn.weight::[:, 384:768]'
        - 'h.0.attn.c_attn.weight::[:, 768:1088]'
        - 'h.0.attn.c_attn.weight::[:, 1152:1536]'
        - 'h.0.attn.c_attn.weight::[:, 1536:1856]'
        - 'h.0.attn.c_attn.weight::[:, 1920:2304]'
      to: 'pruned.0.c_attn.weight'
      dim: 1
  - concat:
      from:
        - 'h.0.attn.c_attn.bias::[0:320]'
        - 'h.0.attn.c_attn.bias::[384:768]'
        - 'h.0.attn.c_attn.bias::[768:1088]'
        - 'h.0.attn.c_attn.bias::[1152:1536]'
        - 'h.0.attn.c_attn.bias::[1536:1856]'
        - 'h.0.attn.c_attn.bias::[1920:2304]'
      to: 'pruned.0.c_attn.bias'
      dim: 0
  - concat:
      from:
        - 'h.0.attn.c_proj.weight::[0:320, :]'
        - 'h.0.attn.c_proj.weight::[384:768, :]'
      to: 'pruned.0.c_proj.weight'
      dim: 0
  - delete: { target: 'h\.0\.attn\.c_attn\.weight' }
  - delete: { target: 'h\.0\.attn\.c_attn\.bias' }
  - delete: { target: 'h\.0\.attn\.c_proj\.weight' }
  - move: { from: 'pruned.0.c_attn.weight', to: 'h.0.attn.c_attn.weight' }
  - move: { from: 'pruned.0.c_attn.bias', to: 'h.0.attn.c_attn.bias' }
  - move: { from: 'pruned.0.c_proj.weight', to: 'h.0.attn.c_proj.weight' }

  # ---- layer 1 ----
