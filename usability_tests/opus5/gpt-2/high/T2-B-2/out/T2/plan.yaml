# T2: structured attention-head pruning of GPT-2 (124M).
#
# Remove head 5 (0-indexed) from every layer. GPT-2 uses Conv1D layout
# ([in, out]), so:
#   * h.<i>.attn.c_attn.weight [768, 2304] is the fused [q | k | v] input
#     projection; heads are 64-wide COLUMN blocks inside each 768-wide
#     q/k/v segment. Head 5 is columns 320:384 of each segment, i.e.
#     320:384, 1088:1152 and 1856:1920 of the full tensor.
#   * h.<i>.attn.c_attn.bias [2304] has the same layout along dim 0.
#   * h.<i>.attn.c_proj.weight [768, 768] is the output projection; heads
#     are 64-wide ROW blocks, so head 5 is rows 320:384.
#
# Each tensor is rebuilt by concatenating the surviving blocks, in order,
# into a temporary name; the original is then deleted and the temporary
# moved back onto the original name (names must not change).

inputs:
  - model::inputs/base/model.safetensors

transforms:

  # ---- layer 0 ----
  # c_attn.weight: keep columns 0:320, 384:768, 768:1088, 1152:1536, 1536:1856, 1920:2304
  - concat:
      from:
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 0:320]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 384:768]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: 'model::pruned.h.0.attn.c_attn.weight'
      dim: 1
  - delete: { target: 'model::h\.0\.attn\.c_attn\.weight' }
  - move:
      from: 'model::pruned\.h\.0\.attn\.c_attn\.weight'
      to: 'model::h.0.attn.c_attn.weight'

  # c_attn.bias: same block layout along dim 0
  - concat:
      from:
        - 'model::h\.0\.attn\.c_attn\.bias::[0:320]'
        - 'model::h\.0\.attn\.c_attn\.bias::[384:768]'
        - 'model::h\.0\.attn\.c_attn\.bias::[768:1088]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1152:1536]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1536:1856]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1920:2304]'
      to: 'model::pruned.h.0.attn.c_attn.bias'
      dim: 0
  - delete: { target: 'model::h\.0\.attn\.c_attn\.bias' }
  - move:
      from: 'model::pruned\.h\.0\.attn\.c_attn\.bias'
      to: 'model::h.0.attn.c_attn.bias'

  # c_proj.weight: keep rows 0:320, 384:768
  - concat:
      from:
        - 'model::h\.0\.attn\.c_proj\.weight::[0:320, :]'
        - 'model::h\.0\.attn\.c_proj\.weight::[384:768, :]'
      to: 'model::pruned.h.0.attn.c_proj.weight'
      dim: 0
  - delete: { target: 'model::h\.0\.attn\.c_proj\.weight' }
  - move:
      from: 'model::pruned\.h\.0\.attn\.c_proj\.weight'
      to: 'model::h.0.attn.c_proj.weight'

  # ---- layer 1 ----
  # c_attn.weight: keep columns 0:320, 384:768, 768:1088, 1152:1536, 1536:1856, 1920:2304
  - concat:
