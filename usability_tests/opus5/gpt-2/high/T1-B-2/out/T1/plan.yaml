# T1: depth pruning of GPT-2 (124M) -- drop blocks 2, 5, 8 and renumber 0..8.
inputs:
  - model::inputs/base/model.safetensors

transforms:
  # --- sanity on the input ------------------------------------------------
  - assert:
      all:
        - count: { of: '.*', is: 160 }
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 }

  # --- 1. remove every tensor of blocks 2, 5, 8 ---------------------------
  - delete: { target: 'h\.(2|5|8)\..*' }
  - assert:
      all:
        - count: { of: '.*', is: 121 }
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 }
        - not: { exists: 'h\.(2|5|8)\..*' }

  # --- 2. renumber survivors, ascending so no move ever hits a live slot --
  #     3->2, 4->3, 6->4, 7->5, 9->6, 10->7, 11->8  (0 and 1 stay put)
  - move: { from: 'h\.3\.(.*)',  to: 'h.2.\1' }
  - move: { from: 'h\.4\.(.*)',  to: 'h.3.\1' }
  - move: { from: 'h\.6\.(.*)',  to: 'h.4.\1' }
  - move: { from: 'h\.7\.(.*)',  to: 'h.5.\1' }
  - move: { from: 'h\.9\.(.*)',  to: 'h.6.\1' }
  - move: { from: 'h\.10\.(.*)', to: 'h.7.\1' }
  - move: { from: 'h\.11\.(.*)', to: 'h.8.\1' }

  # --- 3. required checks -------------------------------------------------
  - assert:
      all:
        # no tensor of blocks 9, 10, 11 remains
        - not: { exists: 'h\.(9|10|11)\..*' }
        # exactly 9 blocks remain
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 }
        # the output has exactly 121 tensors
        - count: { of: '.*', is: 121 }
        # indices are contiguous 0..8 and every block is whole (13 tensors)
        - count: { of: 'h\.[0-8]\..*', is: 117 }
        - count: { of: 'h\.\d+\..*', is: 117 }
        - count: { of: 'h\.\d+\.attn\.bias', is: 9 }
        - count: { of: 'h\.\d+\.ln_1\.weight', is: 9 }
        - count: { of: 'h\.\d+\.ln_2\.weight', is: 9 }
        - count: { of: 'h\.\d+\.mlp\.c_fc\.weight', is: 9 }
        - count: { of: 'h\.\d+\.mlp\.c_proj\.weight', is: 9 }
        # the 4 non-block tensors are still there, untouched in shape/dtype
        - shape: { of: 'wte.weight', is: [50257, 768] }
        - shape: { of: 'wpe.weight', is: [1024, 768] }
        - shape: { of: 'ln_f.weight', is: [768] }
        - shape: { of: 'ln_f.bias', is: [768] }
        - dtype: { of: '.*', is: float32 }
        # shapes survived the rename
        - shape: { of: 'h\.\d+\.attn\.c_attn\.weight', is: [768, 2304] }
        - shape: { of: 'h\.\d+\.attn\.c_proj\.weight', is: [768, 768] }
        - shape: { of: 'h\.\d+\.mlp\.c_fc\.weight', is: [768, 3072] }
        - shape: { of: 'h\.\d+\.mlp\.c_proj\.weight', is: [3072, 768] }

output:
  path: out/T1/model.safetensors
  format: safetensors
