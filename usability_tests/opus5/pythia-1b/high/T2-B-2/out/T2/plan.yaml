# T2: structured attention-head pruning of Pythia-1B (remove head 5 of 8, all 16 layers).
#
# Layout facts used here:
#   query_key_value.weight [6144, 2048] / .bias [6144]: GPT-NeoX interleaved layout,
#     head h owns rows 768*h .. 768*h+767 (q, k, v of that head).
#     head 5 -> rows 3840..4607, so keep rows [0:3840] + [4608:6144] along dim 0.
#   attention.dense.weight [2048, 2048]: heads are 256-wide COLUMN blocks (nn.Linear [out, in]),
#     head 5 -> columns 1280..1536, so keep columns [0:1280] + [1536:2048] along dim 1.
#
# Method: concat the two kept slices into a temporary tensor, delete the original,
# then move the temporary back onto the original name (names must not change).

inputs:
  - model::inputs/base/model.safetensors

transforms:
  # ---- preconditions on the input ---------------------------------------
  - assert:
      all:
        - count: { of: '.*', is: 244 }
        - count: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 16 }
        - shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: [6144, 2048] }
        - shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.bias', is: [6144] }
        - shape: { of: 'gpt_neox\.layers\.0\.attention\.dense\.weight', is: [2048, 2048] }

  # ---- build the pruned tensors -----------------------------------------
  - concat:
      from:
        - 'model::gpt_neox\.layers\.0\.attention\.query_key_value\.weight::[0:3840, :]'
        - 'model::gpt_neox\.layers\.0\.attention\.query_key_value\.weight::[4608:6144, :]'
      to: 'model::pruned_tmp.0.qkv.weight'
      dim: 0
  - concat:
      from:
        - 'model::gpt_neox\.layers\.0\.attention\.query_key_value\.bias::[0:3840]'
        - 'model::gpt_neox\.layers\.0\.attention\.query_key_value\.bias::[4608:6144]'
      to: 'model::pruned_tmp.0.qkv.bias'
      dim: 0
  - concat:
      from:
        - 'model::gpt_neox\.layers\.0\.attention\.dense\.weight::[:, 0:1280]'
        - 'model::gpt_neox\.layers\.0\.attention\.dense\.weight::[:, 1536:2048]'
      to: 'model::pruned_tmp.0.dense.weight'
      dim: 1
  - concat:
      from:
        - 'model::gpt_neox\.layers\.1\.attention\.query_key_value\.weight::[0:3840, :]'
        - 'model::gpt_neox\.layers\.1\.attention\.query_key_value\.weight::[4608:6144, :]'
      to: 'model::pruned_tmp.1.qkv.weight'
      dim: 0
  - concat:
      from:
