        - 'model::gpt_neox\.layers\.1\.attention\.query_key_value\.bias::[4608:6144]'
      to: 'model::pruned_tmp.1.qkv.bias'
      dim: 0
  - concat:
      from:
        - 'model::gpt_neox\.layers\.1\.attention\.dense\.weight::[:, 0:1280]'
        - 'model::gpt_neox\.layers\.1\.attention\.dense\.weight::[:, 1536:2048]'
