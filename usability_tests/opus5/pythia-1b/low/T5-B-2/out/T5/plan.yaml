# T5: LoRA "merge and unload" for Pythia-1B, sharded safetensors export.
#
# delta = (alpha / r) * B @ A = 2 * B @ A, computed in float32,
# added to the float16 base weight in float32, then cast back to float16.
# fan_in_fan_out = false, so B @ A already has the base layout [out, in].

inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # --- pre-flight: the adapter really holds 16 A/B pairs -------------------
  - assert:
      count:
        of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_A\.weight'
        is: 16
  - assert:
      count:
        of: 'lora::base_model\.model\.gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_B\.weight'
        is: 16

  # --- delta = B @ A  (float32, [6144, 16] @ [16, 2048] -> [6144, 2048]) ---
  - matmul:
      from_a: 'lora::base_model\.model\.(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.lora_B\.weight'
      from_b: 'lora::base_model.model.\1.lora_A.weight'
      to: 'base::__delta.\1.weight'

  # exactly 16 pairs were found and merged
  - assert:
      count:
        of: 'base::__delta\..*'
        is: 16
  - assert:
      shape:
        of: 'base::__delta.gpt_neox.layers.0.attention.query_key_value.weight'
        is: [6144, 2048]

  # --- scale by alpha / r = 32 / 16 = 2 -----------------------------------
  - scale_:
      target: 'base::__delta\..*'
      by: 2.0

  # --- W += delta, in float32, then back to float16 -----------------------
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float32
  - add_:
      from: 'base::__delta\.(gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight)'
      to: 'base::\1'
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float16

  # --- drop the intermediates ---------------------------------------------
  - delete:
      target: 'base::__delta\..*'

  # --- required checks on what is about to be written ----------------------
  - assert:
      not:
        exists: 'base::.*lora_.*'
  - assert:
      not:
        exists: 'base::__delta\..*'
  - assert:
      shape:
        of: 'base::gpt_neox.layers.0.attention.query_key_value.weight'
        is: [6144, 2048]
  - assert:
      dtype:
        of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
        is: float16
  - assert:
      count:
        of: 'base::.*'
        is: 244

output:
  path: out/T5
  format: safetensors
  shard: 512MB
