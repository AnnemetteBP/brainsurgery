  - copy: { from: 'gpt_neox.layers.15.attention.dense.weight::[:, :1280]', to: tmp.15.densew_a }
  - copy: { from: 'gpt_neox.layers.15.attention.dense.weight::[:, 1536:]', to: tmp.15.densew_b }
  - delete: { target: 'gpt_neox.layers.15.attention\.dense\.weight' }
  - concat: { from: [tmp.15.densew_a, tmp.15.densew_b], to: 'gpt_neox.layers.15.attention.dense.weight', dim: 1 }

  # ---- drop scratch tensors ----
  - delete: { target: 'tmp\..*' }

  # ---- required checks ----
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: [5376, 2048] } }
