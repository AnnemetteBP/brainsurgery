  - concat: { from: [tmp.14.densew_a, tmp.14.densew_b], to: 'gpt_neox.layers.14.attention.dense.weight', dim: 1 }

  # ---- layer 15 ----
  - copy: { from: 'gpt_neox.layers.15.attention.query_key_value.weight::[:3840, :]', to: tmp.15.qkvw_a }
  - copy: { from: 'gpt_neox.layers.15.attention.query_key_value.weight::[4608:, :]', to: tmp.15.qkvw_b }
  - delete: { target: 'gpt_neox.layers.15.attention\.query_key_value\.weight' }
