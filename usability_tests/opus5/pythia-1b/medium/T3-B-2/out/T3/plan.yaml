# T3: mixed-precision export with sharding (Pythia-1B)
inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Drop the 48 non-parameter buffers (causal mask, masked_bias, rotary inv_freq).
  - assert:
      count:
        of: 'gpt_neox\.layers\.\d+\.attention\.(?:bias|masked_bias|rotary_emb\.inv_freq)'
        is: 48
  - delete:
      target: 'gpt_neox\.layers\.\d+\.attention\.(?:bias|masked_bias|rotary_emb\.inv_freq)'

  # 2. Everything that survives becomes float32 (exact upcast from float16).
  - cast_: { target: '.*', to: float32 }

  # 3. Only the 64 projection matrices go down to bfloat16.
  - assert:
      count:
        of: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.dense_(?:h_to_4h|4h_to_h))\.weight'
        is: 64
  - cast_:
      target: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.dense_(?:h_to_4h|4h_to_h))\.weight'
      to: bfloat16

  # Required checks.
  - assert:
      all:
        # exactly 64 tensors are bfloat16: the 64 projections are bf16 ...
        - count:
            of: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.dense_(?:h_to_4h|4h_to_h))\.weight'
            is: 64
        - dtype:
            of: 'gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.dense_(?:h_to_4h|4h_to_h))\.weight'
            is: bfloat16
        # ... and every other tensor is float32, so none of them is bfloat16.
        - dtype:
            of: '(?!gpt_neox\.layers\.\d+\.(?:attention\.(?:query_key_value|dense)|mlp\.dense_(?:h_to_4h|4h_to_h))\.weight$).*'
            is: float32
        - dtype: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: bfloat16 }
        - dtype: { of: 'gpt_neox\.embed_in\.weight', is: float32 }
        - count: { of: '.*', is: 196 }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
