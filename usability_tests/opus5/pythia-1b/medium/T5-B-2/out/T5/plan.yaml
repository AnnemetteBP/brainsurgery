# T5: LoRA merge-and-unload for Pythia-1B, sharded export.
#
# delta = (lora_alpha / r) * B @ A = 2 * B @ A, computed in float32,
# added to the float16 base weight (temporarily widened to float32),
# then cast back to float16.  fan_in_fan_out = false, so no transpose.

inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # --- preconditions on the adapter -------------------------------------
  - assert:
      all:
        - count: { of: 'lora::.*\.lora_A\.weight', is: 16 }
        - count: { of: 'lora::.*\.lora_B\.weight', is: 16 }
        - count: { of: 'base::.*', is: 244 }
        - shape:
            of: 'base::gpt_neox\.layers\.0\.attention\.query_key_value\.weight'
            is: [6144, 2048]

  # --- delta = B @ A  (float32), parked on the base alias ----------------
  - matmul:
      from_a: 'lora::base_model\.model\.(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.lora_B\.weight'
      from_b: 'lora::base_model.model.\1.lora_A.weight'
      to: 'base::\1.mergedelta'

  # exactly 16 adapter pairs were found and merged
  - assert:
      all:
        - count: { of: 'base::.*\.mergedelta', is: 16 }
        - shape:
            of: 'base::gpt_neox\.layers\.0\.attention\.query_key_value\.mergedelta'
            is: [6144, 2048]
        - dtype: { of: 'base::.*\.mergedelta', is: float32 }

  # --- scale by alpha / r = 2 -------------------------------------------
  - scale_: { target: 'base::.*\.mergedelta', by: 2.0 }

  # --- accumulate in float32, then narrow back to the base dtype ---------
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float32
  - add_:
      from: 'base::(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.mergedelta'
      to: 'base::\1.weight'
  - cast_:
      target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
      to: float16

  # --- drop the intermediates -------------------------------------------
  - delete: { target: 'base::.*\.mergedelta' }

  # --- postconditions ----------------------------------------------------
  - assert:
      all:
        - not: { exists: 'base::.*lora_.*' }
        - not: { exists: 'base::.*\.mergedelta' }
        - shape:
            of: 'base::gpt_neox\.layers\.0\.attention\.query_key_value\.weight'
            is: [6144, 2048]
        - dtype:
            of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight'
            is: float16
        - count: { of: 'base::.*', is: 244 }

output:
  path: out/T5
  format: safetensors
  shard: 512MB
