inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Remove every tensor of blocks 2, 5, 8.
  - delete: { target: 'h\.2\..*' }
  - delete: { target: 'h\.5\..*' }
  - delete: { target: 'h\.8\..*' }

  # 2. Renumber surviving blocks so indices run 0..8 without gaps.
  # 0 and 1 are already correct and untouched. Moves are ordered so each
  # destination slot is vacated (by an earlier delete or an earlier move
  # in this list) before it is written to, avoiding collisions.
  - move: { from: 'h\.3\.(.*)', to: 'h.2.\1' }
  - move: { from: 'h\.4\.(.*)', to: 'h.3.\1' }
  - move: { from: 'h\.6\.(.*)', to: 'h.4.\1' }
  - move: { from: 'h\.7\.(.*)', to: 'h.5.\1' }
  - move: { from: 'h\.9\.(.*)', to: 'h.6.\1' }
  - move: { from: 'h\.10\.(.*)', to: 'h.7.\1' }
  - move: { from: 'h\.11\.(.*)', to: 'h.8.\1' }

  # Required checks: fail loudly (non-zero exit, no output written) if any
  # of these do not hold.
  - assert: { not: { exists: 'h\.(9|10|11)\..*' } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 } }
  - assert: { count: { of: '.*', is: 121 } }

output:
  path: out/T1/model.safetensors
  format: safetensors
