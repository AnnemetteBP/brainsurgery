inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Preflight: confirm the expected base layout before editing.
  - assert: { count: { of: '.*', is: 160 } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.weight', is: [768, 2304] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.bias', is: [2304] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_proj\.weight', is: [768, 768] } }

  # Rename originals out of the way so concat can write the pruned tensors back
  # under the same names (concat destinations must not already exist).
  - move: { from: 'h\.(\d+)\.attn\.c_attn\.weight', to: 'h.\1.attn.c_attn_orig.weight' }
  - move: { from: 'h\.(\d+)\.attn\.c_attn\.bias', to: 'h.\1.attn.c_attn_orig.bias' }
  - move: { from: 'h\.(\d+)\.attn\.c_proj\.weight', to: 'h.\1.attn.c_proj_orig.weight' }

  # Drop head 5 (0-indexed) from every layer: concat.weight keeps column blocks
  # (dim=1) outside the q/k/v head-5 slices; c_proj.weight keeps row blocks (dim=0).
  - concat:
      from:
        - 'h.0.attn.c_attn_orig.weight::[:, 0:320]'
        - 'h.0.attn.c_attn_orig.weight::[:, 384:768]'
        - 'h.0.attn.c_attn_orig.weight::[:, 768:1088]'
        - 'h.0.attn.c_attn_orig.weight::[:, 1152:1536]'
        - 'h.0.attn.c_attn_orig.weight::[:, 1536:1856]'
        - 'h.0.attn.c_attn_orig.weight::[:, 1920:2304]'
      to: h.0.attn.c_attn.weight
      dim: 1
  - concat:
      from:
        - 'h.0.attn.c_attn_orig.bias::[0:320]'
        - 'h.0.attn.c_attn_orig.bias::[384:768]'
        - 'h.0.attn.c_attn_orig.bias::[768:1088]'
        - 'h.0.attn.c_attn_orig.bias::[1152:1536]'
        - 'h.0.attn.c_attn_orig.bias::[1536:1856]'
        - 'h.0.attn.c_attn_orig.bias::[1920:2304]'
      to: h.0.attn.c_attn.bias
      dim: 0
  - concat:
      from:
        - 'h.0.attn.c_proj_orig.weight::[0:320, :]'
        - 'h.0.attn.c_proj_orig.weight::[384:768, :]'
