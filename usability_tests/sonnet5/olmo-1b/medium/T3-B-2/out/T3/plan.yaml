inputs:
  - model::inputs/base

transforms:
  # Cast exactly the 112 projection matrices (q/k/v/o_proj, gate/up/down_proj)
  # to bfloat16, in place. embed_tokens.weight and lm_head.weight are
  # deliberately excluded by this pattern.
  - cast_:
      target: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
      to: bfloat16

  # Required checks: fail loudly if the cast did not land exactly right.
  - assert:
      count:
        of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: 112
  - assert:
      dtype:
        of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: bfloat16
  - assert:
      dtype:
        of: model.layers.0.self_attn.q_proj.weight
        is: bfloat16
  - assert:
      dtype:
        of: model.embed_tokens.weight
        is: float32
  - assert:
      dtype:
        of: lm_head.weight
        is: float32
  - assert:
      count:
        of: '.*'
        is: 114

output:
  path: out/T3
  format: safetensors
  shard: 256MB
