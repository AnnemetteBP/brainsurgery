inputs:
  - model::inputs/base

transforms:
  # Sanity: input has exactly 114 tensors, all float32.
  - assert: { count: { of: 'model::.*', is: 114 } }
  - assert: { dtype: { of: 'model::.*', is: float32 } }

  # The 112 projection matrices: attention q/k/v/o and mlp gate/up/down,
  # per layer. This regex cannot match model.embed_tokens.weight or
  # lm_head.weight (no "layers" segment).
  - assert:
      count:
        of: 'model::model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: 112

  # Cast exactly those tensors to bfloat16 in place; everything else stays
  # float32 with unchanged values.
  - cast_:
      target: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
      to: bfloat16

  # Required checks from TASK.md.
  - assert:
      count:
        of: 'model::model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: 112
  - assert:
      dtype:
        of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: bfloat16
  - assert:
      dtype: { of: 'model.layers.0.self_attn.q_proj.weight', is: bfloat16 }
  - assert:
      dtype: { of: 'model.embed_tokens.weight', is: float32 }
  - assert:
      dtype: { of: 'lm_head.weight', is: float32 }
  - assert: { count: { of: 'model::.*', is: 114 } }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
