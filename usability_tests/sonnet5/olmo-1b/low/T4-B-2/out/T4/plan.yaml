inputs:
  - base::inputs/base
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

output:
  path: out/T4/model.safetensors
  format: safetensors

transforms:
  # --- Step 1: verify all three checkpoints agree everywhere except the 48 MLP tensors ---

  - assert: { count: { of: 'base::.*', is: 114 } }
  - assert: { count: { of: 'ft1::.*', is: 114 } }
  - assert: { count: { of: 'ft2::.*', is: 114 } }

  # The 48 MLP tensors must exist with matching names/shapes/dtypes in all three
  # (eps huge so only name/shape/dtype are enforced, not value equality).
  - assert: { count: { of: 'base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert:
      equal:
        left: 'base::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
        right: 'ft1::\1'
        eps: 1.0e30
  - assert:
      equal:
        left: 'base::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
        right: 'ft2::\1'
        eps: 1.0e30

  # Everything outside the MLP tensors must be bit-identical across all three checkpoints.
  - assert:
      equal:
        left: 'base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight).+'
        right: 'ft1::\g<0>'
  - assert:
      equal:
        left: 'base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight).+'
        right: 'ft2::\g<0>'

  # --- Step 2: task-vector merge, lambda = 0.4, computed against the unmodified base ---

  # Stage ft1 and ft2 MLP tensors into the base alias as temporaries (untouched base copies).
  - copy:
      from: 'ft1::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::tmp1.\1'
  - copy:
      from: 'ft2::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::tmp2.\1'

  # tmp1 <- ft1 - base ; tmp2 <- ft2 - base (both against the still-unmodified base).
  - subtract_:
      from: 'base::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::tmp1.\1'
  - subtract_:
      from: 'base::(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::tmp2.\1'

  # Scale both task vectors by lambda = 0.4.
  - scale_: { target: 'base::tmp1\.model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', by: 0.4 }
  - scale_: { target: 'base::tmp2\.model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', by: 0.4 }

  # base <- base + lambda*(ft1-base) + lambda*(ft2-base)
  - add_:
      from: 'base::tmp1.(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'
  - add_:
      from: 'base::tmp2.(model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight)'
      to: 'base::\1'

  # Drop the temporaries; only the base alias remains.
  - delete: { target: 'base::tmp1\..*' }
  - delete: { target: 'base::tmp2\..*' }

  # --- Final checks ---
  - assert: { count: { of: 'base::.*', is: 114 } }
