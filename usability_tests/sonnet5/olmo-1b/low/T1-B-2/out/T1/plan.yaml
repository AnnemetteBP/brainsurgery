inputs:
  - model::inputs/base

output:
  path: out/T1/model.safetensors

transforms:
  # Preflight: confirm the input shape we expect (16 blocks, 114 tensors).
  - assert: { count: { of: 'model.layers\.\d+\.self_attn\.q_proj\.weight', is: 16 } }
  - assert: { count: { of: '.*', is: 114 } }

  # Remove every tensor of the pruned blocks (2, 6, 10, 14).
  - delete: { target: 'model.layers\.2\..*' }
  - delete: { target: 'model.layers\.6\..*' }
  - delete: { target: 'model.layers\.10\..*' }
  - delete: { target: 'model.layers\.14\..*' }

  # Renumber survivors. Old index is always >= new index, so processing in
  # ascending old-index order guarantees each destination slot is already
  # vacated (either deleted above or moved away in an earlier step here)
  # before we move into it, with no collisions.
  - move: { from: 'model.layers\.3\.(.*)', to: 'model.layers.2.\1' }
  - move: { from: 'model.layers\.4\.(.*)', to: 'model.layers.3.\1' }
  - move: { from: 'model.layers\.5\.(.*)', to: 'model.layers.4.\1' }
  - move: { from: 'model.layers\.7\.(.*)', to: 'model.layers.5.\1' }
  - move: { from: 'model.layers\.8\.(.*)', to: 'model.layers.6.\1' }
  - move: { from: 'model.layers\.9\.(.*)', to: 'model.layers.7.\1' }
  - move: { from: 'model.layers\.11\.(.*)', to: 'model.layers.8.\1' }
  - move: { from: 'model.layers\.12\.(.*)', to: 'model.layers.9.\1' }
  - move: { from: 'model.layers\.13\.(.*)', to: 'model.layers.10.\1' }
  - move: { from: 'model.layers\.15\.(.*)', to: 'model.layers.11.\1' }

  # Required checks: fail loudly if the result is wrong.
  - assert: { not: { exists: 'model.layers\.(12|13|14|15)\..*' } }
  - assert: { count: { of: 'model.layers\.\d+\.self_attn\.q_proj\.weight', is: 12 } }
  - assert: { count: { of: '.*', is: 86 } }

  # Non-block tensors are untouched (still present, unchanged shape).
  - assert: { exists: model.embed_tokens.weight }
  - assert: { exists: lm_head.weight }
