        - gpt_neox.layers.9.attention.query_key_value.bias::[0:3840]
        - gpt_neox.layers.9.attention.query_key_value.bias::[4608:6144]
      to: gpt_neox.layers.9.attention.query_key_value.bias_pruned
      dim: 0
  - concat:
