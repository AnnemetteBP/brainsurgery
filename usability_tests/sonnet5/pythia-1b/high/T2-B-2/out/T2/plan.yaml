  # --- Swap pruned tensors in under the original names. ---
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight' }
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.bias' }
  - delete: { target: 'gpt_neox\.layers\.\d+\.attention\.dense\.weight' }
  - move:
      from: 'gpt_neox\.layers\.(\d+)\.attention\.query_key_value\.weight_pruned'
      to: 'gpt_neox.layers.\1.attention.query_key_value.weight'
  - move:
      from: 'gpt_neox\.layers\.(\d+)\.attention\.query_key_value\.bias_pruned'
      to: 'gpt_neox.layers.\1.attention.query_key_value.bias'
  - move:
      from: 'gpt_neox\.layers\.(\d+)\.attention\.dense\.weight_pruned'
      to: 'gpt_neox.layers.\1.attention.dense.weight'

